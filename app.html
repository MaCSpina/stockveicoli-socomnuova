<script>

  <header>
    <h1>Socom Nuova Stock</h1>
    <div id="ultimo-aggiornamento">Ultimo aggiornamento: ...</div>
  </header>

  <main>
    <div id="filtri-attivi"></div>

    <div class="toolbar">
      <button onclick="applicaFiltro()">Applica Filtro</button>
      <button onclick="resettaFiltro()">Reset Filtro</button>
      <button onclick="caricaDati()">Aggiorna</button>
    </div>

    <div class="filtri" id="parametri"></div>

    <div id="msg"></div>
    <div id="tabella-container"></div>
  </main>

  <script>
  
let BASE_URL = "";
    let URL_OPTIONAL = "";
    let URL_SCHEDE_PDF = "";

    const campiEsclusiFiltri = ["data_prenotazione","id_veicolo","VAN","telaio","versione","data_inserimento_ordine","data_arrivo","giorni_giacenza","data_arrivo_prevista","scadenza_prenot","cod_gomme_specifico","descr_gomme_specifico","cod_gomme_generico","descr_gomme_generico","data_ins_OCF","larghezza","listino_originale","prezzo_versione","prezzo_opt","cod_fdp2","aggiornamento_stock","cod_modello_vp","cod_tipologia_allestimento"];
    const campiDate = ["data_prenotazione","data_inserimento_ordine","data_arrivo","data_ins_OCF","data_arrivo_prevista","scadenza_prenot"];
    let intestazione = [], dati = []; let optionalDati = []; let schedePdf = {};

    function formattaData(str) {
      if (!str) return "";
      const d = new Date(str);
      if (isNaN(d)) return str;
      const gg = String(d.getDate()).padStart(2,'0'),
            mm = String(d.getMonth()+1).padStart(2,'0'),
            yyyy = d.getFullYear();
      return `${gg}/${mm}/${yyyy}`;
    }

    function caricaDati() {
      fetch(BASE_URL + "?nocache=" + Date.now())
        .then(r => r.text())
        .then(testo => {
          const righe = testo.trim().split(/\r?\n/);
          intestazione = righe[0].replaceAll('"','').split(";");
          dati = righe.slice(1).map(r => {
            const vals = r.split(/;(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v=>v.replace(/^"|"$/g,""));
            const obj = {};
            intestazione.forEach((k,i)=>obj[k]=vals[i]||"");
            return obj;
          });

          let ultimo = dati.find(r => r["aggiornamento_stock"])?.["aggiornamento_stock"] || "";
          if (ultimo) document.getElementById("ultimo-aggiornamento").textContent = "Ultimo aggiornamento: " + ultimo;

          creaFiltri();
          mostraTabella(dati);
          mostraMessaggio(`${dati.length} record trovati`);
        });
    }
	

function caricaOptional() {
  fetch(URL_OPTIONAL + "?nocache=" + Date.now())
    .then(r => r.text())
    .then(text => {
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // rimuove BOM se presente

      const righe = text.trim().split(/\r?\n/);
      const intestazione = righe[0].replaceAll('"', '').split(";");

      optionalDati = righe.slice(1).map(r => {
        const valori = r.split(";").map(v => v.replace(/^"|"$/g, ""));
        const obj = {};
        intestazione.forEach((col, i) => obj[col] = valori[i] || "");
        return {
          codice: obj.optional,
          descrizione: obj.descrizione,
          prezzo: obj.prezzo,
          id_veicolo: obj.id_veicolo
        };
      });

      console.log("Optional caricati:", optionalDati.length);
    })
    .catch(err => console.error("Errore fetch optional:", err));
}

function caricaSchedePdf() {
  return fetch(URL_SCHEDE_PDF + "?nocache=" + Date.now())
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(text => {
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      const righe = text.trim().split(/\r?\n/);
      if (righe.length < 2) return;
      const intestazioniPdf = righe[0].replaceAll('"', '').split(";").map(x => x.trim());
      const idxId = intestazioniPdf.indexOf("id_veicolo");
      const idxUrl = intestazioniPdf.indexOf("url_pdf");
      if (idxId < 0 || idxUrl < 0) throw new Error("Colonne id_veicolo/url_pdf non trovate nel CSV");
      schedePdf = {};
      righe.slice(1).forEach(riga => {
        const campi = riga.split(";").map(v => v.replace(/^"|"$/g, "").trim());
        const id = campi[idxId];
        const url = campi[idxUrl];
        if (id && url && /^https:\/\//i.test(url)) schedePdf[id] = url;
      });
      console.log("Schede PDF caricate:", Object.keys(schedePdf).length);
    })
    .catch(err => console.error("Errore caricamento schede PDF:", err));
}

// Funzione che legge i collegamenti da config.json in modo sicuro
    async function avviaConfigurazione() {
        try {
            const res = await fetch("config.json?nocache=" + Date.now());
            if (!res.ok) throw new Error("Impossibile caricare la configurazione");
            const config = await res.json();
            
            BASE_URL = config.BASE_URL;
            URL_OPTIONAL = config.URL_OPTIONAL;
            URL_SCHEDE_PDF = config.URL_SCHEDE_PDF;

            // Ora le funzioni esistono e possono essere chiamate senza errori!
            caricaDati();
            caricaOptional();
            caricaSchedePdf();
        } catch (err) {
            console.error("Errore nel caricamento della configurazione protetta:", err);
            document.getElementById("msg").textContent = "Errore di connessione ai dati protetti.";
        }
    }

    // All'avvio della pagina, partiamo caricando la configurazione protetta
    window.onload = () => {
        avviaConfigurazione();
    };



function mostraDettagli(veicolo) {
  const modal = document.getElementById("dettagliModal");
  const contenuto = document.getElementById("contenutoDettagli");

  console.log("Veicolo passato a mostraDettagli:", veicolo);

let htmlSinistra = `<h2>Veicolo ID ${veicolo.id_veicolo || "N/D"}</h2><ul class="lista-dettagli">`;

const campiDaNascondereDettaglio = new Set([
  "cod_modello_vp", "famiglia_iveco", "versione", "data_inserimento_ordine",
  "data_arrivo", "data_prenotazione", "descr_fdp", "cod_fdp",
  "listino_originale", "prezzo_versione", "prezzo_opt",
  "cod_tipologia_allestimento", "cod_fdp2", "aggiornamento_stock"
]);

intestazione.forEach(key => {
  if (key !== "id_veicolo" && !campiDaNascondereDettaglio.has(String(key).toLowerCase())) {
    let val = veicolo[key];
    if (campiDate.includes(key)) {
      val = formattaData(val);
    }
    if (!val) val = "—";
    val = String(val).replace(/</g, "&lt;").replace(/>/g, "&gt;");
    htmlSinistra += `<li><strong>${key}:</strong> <span>${val}</span></li>`;
  }
});

htmlSinistra += `</ul>`;

const urlSchedaPdf = schedePdf[String(veicolo.id_veicolo || "").trim()];
if (urlSchedaPdf) {
  htmlSinistra += `<p style="margin-top:16px"><a href="${urlSchedaPdf}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:10px 14px;background:#1769aa;color:white;text-decoration:none;border-radius:6px;font-weight:bold">📄 Dettagli allestimento</a></p>`;
}


  // Optional come prima
  let htmlDestra = "";

  const optional = optionalDati
    .filter(o => o.id_veicolo === veicolo.id_veicolo)
    .sort((a, b) => a.codice.localeCompare(b.codice));

  if (optional.length) {
     htmlDestra += `<h3>Optional:</h3><div class="optional-wrapper"><table class='tabella-optional'><thead><tr><th>Codice</th><th>Descrizione</th><th>Prezzo</th></tr></thead><tbody>`;
    optional.forEach(opt => {
      htmlDestra += `<tr><td>${opt.codice}</td><td>${opt.descrizione}</td><td>€${opt.prezzo}</td></tr>`;
    });
    htmlDestra += `</tbody></table></div>`;
  } else {
    htmlDestra += "<p><em>Nessun optional trovato.</em></p>";
  }

  const html = `
    <div class="modale-doppia-colonna">
      <div class="colonna-sinistra">${htmlSinistra}</div>
      <div class="colonna-destra">${htmlDestra}</div>
    </div>
  `;

  contenuto.innerHTML = html;
  modal.style.display = "block";
}



    function creaFiltri() {
      const div = document.getElementById("parametri"); div.innerHTML="";
      intestazione.forEach((col,i) => {
        if (campiEsclusiFiltri.includes(col)) return;
        const sel = document.createElement("select");
        sel.multiple = true;
        sel.setAttribute("data-col-index", i);
        [...new Set(dati.map(r=>r[col]).filter(Boolean))].sort().forEach(v=>{
          const o = document.createElement("option"); o.value=v; o.textContent=v;
          sel.append(o);
        });
        const l = document.createElement("label");
        l.className="filtro";
        l.innerHTML=`<strong>${col}</strong>`;
        l.appendChild(sel);
        div.appendChild(l);
      });
    }

function mostraTabella(arr) {
  const colonneTabella = [
    { label: "id_veicolo", campo: "id_veicolo" },
    { label: "descrizione", campo: "descrizione" },
    { label: "des_colore", campo: "des_colore" },
    { label: "VAN", campo: "VAN" },
    { label: "Prenota via WhatsApp", whatsapp: true },
    { label: "TELAIO", campo: "TELAIO" },
    { label: "descri_status", campo: "descri_status" },
    { label: "stato_avanz_ordine", campo: "stato_avanz_ordine" },
    { label: "giorni_giacenza", campo: "giorni_giacenza" },
    { label: "data_arrivo_prevista", campo: "data_arrivo_prevista" },
    { label: "descr_passo", campo: "descr_passo" },
    { label: "note", campo: "note" },
    { label: "tipo_allestimento", campo: "tipo_allestimento" },
    { label: "Dettagli allestimento", scheda: true },
    { label: "prezzo_vendita_web", campo: "prezzo_vendita_web" },
    { label: "prenotato_da", campo: "prenotato_da" },
    { label: "scadenza_prenot", campo: "scadenza_prenot" },
    { label: "nota_pren", campo: "nota_pren" }
  ];

  const campiInGrassetto = new Set([
    "descrizione", "descri_status", "stato_avanz_ordine",
    "data_arrivo_prevista", "tipo_allestimento", "prezzo_vendita_web",
    "prenotato_da", "scadenza_prenot", "nota_pren"
  ]);

  function chiaveCampo(record, nomeCampo) {
    if (Object.prototype.hasOwnProperty.call(record, nomeCampo)) return nomeCampo;
    const nomeMinuscolo = nomeCampo.toLowerCase();
    return Object.keys(record).find(k => k.toLowerCase() === nomeMinuscolo) || nomeCampo;
  }

  function formattaPrezzoEuro(valore) {
    if (valore === null || valore === undefined || String(valore).trim() === "") return "";
    if (typeof valore === "number") {
      return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(valore);
    }
    let testo = String(valore).trim().replace(/€|\s/g, "");
    // Supporta sia valori italiani (1.234,56) sia valori con decimale inglese (1234.56).
    if (testo.includes(",")) {
      testo = testo.replace(/\./g, "").replace(",", ".");
    }
    const numero = Number(testo);
    if (!Number.isFinite(numero)) return String(valore);
    return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(numero);
  }

  const cont = document.getElementById("tabella-container");
  const t = document.createElement("table");
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  colonneTabella.forEach(col => {
    const th = document.createElement("th");
    th.textContent = col.label;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  t.appendChild(thead);

  const tbody = document.createElement("tbody");
  arr.forEach(r => {
    const tr = document.createElement("tr");
    if (r[chiaveCampo(r, "prenotato_da")]?.trim()) tr.classList.add("highlight");

    colonneTabella.forEach(col => {
      const td = document.createElement("td");
      td.setAttribute("data-label", col.label);

      if (col.whatsapp) {
        const van = String(r[chiaveCampo(r, "VAN")] || "").trim();
        if (van) {
          const messaggio = `ciao, mi potresti prenotare il VAN ${van}`;
          const linkWhatsApp = document.createElement("a");
          linkWhatsApp.href = `https://wa.me/390812588214?text=${encodeURIComponent(messaggio)}`;
          linkWhatsApp.target = "_blank";
          linkWhatsApp.rel = "noopener noreferrer";
          linkWhatsApp.textContent = "💬 Prenota";
          linkWhatsApp.title = `Apri WhatsApp con il messaggio: ${messaggio}`;
          linkWhatsApp.style.cssText = "display:inline-block;padding:6px 9px;background:#25D366;color:#fff;text-decoration:none;border-radius:5px;font-weight:bold;white-space:nowrap";
          linkWhatsApp.addEventListener("click", ev => ev.stopPropagation());
          td.appendChild(linkWhatsApp);
        } else {
          td.textContent = "—";
        }
      } else if (col.scheda) {
        const urlSchedaPdf = schedePdf[String(r[chiaveCampo(r, "id_veicolo")] || "").trim()];
        if (urlSchedaPdf) {
          const link = document.createElement("a");
          link.href = urlSchedaPdf;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "📄 Apri";
          link.title = "Apri dettagli allestimento in una nuova pagina";
          link.style.cssText = "display:inline-block;padding:5px 9px;background:#1769aa;color:white;text-decoration:none;border-radius:5px;font-weight:bold;white-space:nowrap";
          link.addEventListener("click", ev => ev.stopPropagation());
          td.appendChild(link);
        } else {
          td.textContent = "—";
        }
      } else {
        const chiave = chiaveCampo(r, col.campo);
        let v = r[chiave] || "";
        if (campiDate.some(c => c.toLowerCase() === col.campo.toLowerCase())) {
          v = formattaData(v);
        } else if (col.campo.toLowerCase() === "giorni_giacenza") {
          v = v ? Math.round(parseFloat(v)).toString() : "";
        } else if (col.campo.toLowerCase() === "prezzo_vendita_web") {
          v = formattaPrezzoEuro(v);
        }
        td.textContent = v;
        if (campiInGrassetto.has(col.campo.toLowerCase())) td.style.fontWeight = "bold";

        // Mostra il segnale "Pronta consegna" nella colonna descrizione.
        if (col.campo.toLowerCase() === "descrizione" && String(r[chiaveCampo(r, "tipo_allestimento")] || "").trim()) {
          const badge = document.createElement("span");
          badge.textContent = "Pronta consegna";
          badge.style.cssText = "display:inline-block;margin-left:7px;padding:3px 6px;background:#16803c;color:#fff;border-radius:4px;font-size:11px;font-weight:bold;white-space:nowrap";
          td.appendChild(document.createTextNode(" "));
          td.appendChild(badge);
        }
      }
      tr.appendChild(td);
    });
    tr.style.cursor = "pointer";
    tr.onclick = () => mostraDettagli(r);
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  cont.innerHTML = "";
  cont.appendChild(t);
}

    function mostraMessaggio(txt) { document.getElementById("msg").textContent = txt; }

    // Aggiorna le opzioni di ciascun filtro in base alle selezioni degli ALTRI filtri.
    // Le selezioni già effettuate vengono mantenute anche se la combinazione restituisce zero risultati.
    function aggiornaOpzioniFiltri() {
      const selects = Array.from(document.querySelectorAll(".filtri select"));

      selects.forEach(sel => {
        const idx = parseInt(sel.getAttribute("data-col-index"), 10);
        const col = intestazione[idx];
        const selezionati = Array.from(sel.selectedOptions).map(o => o.value);
        let compatibili = [...dati];

        selects.forEach(altro => {
          if (altro === sel) return;
          const idxAltro = parseInt(altro.getAttribute("data-col-index"), 10);
          const colAltro = intestazione[idxAltro];
          const valoriAltro = Array.from(altro.selectedOptions).map(o => o.value);
          if (valoriAltro.length) {
            compatibili = compatibili.filter(r => valoriAltro.includes(r[colAltro]));
          }
        });

        const valoriDisponibili = new Set(compatibili.map(r => r[col]).filter(v => v !== undefined && v !== null && String(v) !== ""));
        selezionati.forEach(v => valoriDisponibili.add(v));
        const ordinati = Array.from(valoriDisponibili).sort((a, b) => String(a).localeCompare(String(b), "it"));

        sel.innerHTML = "";
        ordinati.forEach(v => {
          const opzione = document.createElement("option");
          opzione.value = v;
          opzione.textContent = v;
          opzione.selected = selezionati.includes(v);
          sel.appendChild(opzione);
        });
      });
    }

    function applicaFiltro() {
      const filtriNodo = document.getElementById("filtri-attivi");
      filtriNodo.innerHTML = "";
      let arr = [...dati];

      document.querySelectorAll(".filtri select").forEach(sel => {
        const idx = parseInt(sel.getAttribute("data-col-index"), 10);
        const col = intestazione[idx];
        const selvals = Array.from(sel.selectedOptions).map(o => o.value);
        if (selvals.length > 0) {
          arr = arr.filter(r => selvals.includes(r[col]));
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = `${col}: ${selvals.join(", ")}`;
          const btn = document.createElement("button");
          btn.textContent = "×";
          btn.title = "Rimuovi questo filtro";
          btn.onclick = () => {
            selvals.forEach(v => {
              for (const o of sel.options) if (o.value === v) o.selected = false;
            });
            applicaFiltro();
          };
          badge.append(btn);
          filtriNodo.append(badge);
        }
      });

      aggiornaOpzioniFiltri();
      mostraTabella(arr);
      mostraMessaggio(`${arr.length} record trovati`);
    }

    function resettaFiltro() {
      document.querySelectorAll(".filtri select").forEach(s => {
        Array.from(s.options).forEach(o => o.selected = false);
      });
      document.getElementById("filtri-attivi").textContent = "";
      aggiornaOpzioniFiltri();
      mostraTabella(dati);
      mostraMessaggio(`${dati.length} record trovati`);
    }

            /* Non bloccare intere colonne/tabelle su una pagina: lascia scorrere gli optional
               nello spazio disponibile fin dalla prima pagina. Mantieni unite solo le righe. */

              break-inside: auto !important;

}


  </script>
  
  <div id="dettagliModal" style="display:none; position:fixed; top:10%; left:10%; width:80%; max-height:80vh; overflow-y:auto; background:#fff; border:1px solid #ccc; padding:20px; z-index:9999; border-radius:8px; box-shadow: 0 0 15px rgba(0,0,0,0.3); font-family:Arial, sans-serif;">
