<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <title>Socom Nuova Stock</title>
  <style>
    /* Stili generali */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #121e2d; color: white; }
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    h1 { margin: 0; font-size: 2em; color: #00bfff; }
    #ultimo-aggiornamento { font-size: 0.9em; color: #cccccc; margin-top: 4px; }
    
    /* Box utente loggato nell'header */
    .user-badge-container { display: flex; align-items: center; gap: 10px; background: #1c2d42; padding: 8px 14px; border-radius: 8px; border: 1px solid #0055aa; }
    .user-badge-text { font-size: 0.9em; color: #00e5ff; font-weight: bold; }
    .btn-logout { background: #d32f2f; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
    .btn-logout:hover { background: #b71c1c; }

    .filtri { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
    .filtro { display: flex; flex-direction: column; min-width: 150px; }
    select { min-height: 80px; background: #f8f8f8; border: 1px solid #ccc; border-radius: 5px; white-space: normal; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; background: white; color: black; table-layout: auto; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background: #003366; color: white; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
    td { white-space: normal; }
    tr.highlight { background-color: #fdd !important; }
    
    /* Area messaggi e pulsante riepilogo in alto */
    .status-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    #msg { font-weight: bold; color: #fff; }
    .btn-riepilogo { padding: 6px 12px; font-size: 0.9em; cursor: pointer; background: #16803c; color: white; border: none; border-radius: 5px; font-weight: bold; }
    .btn-riepilogo:hover { background: #126530; }

    #filtri-attivi { margin-bottom: 15px; font-style: italic; color: #00cc66; font-weight: bold; }
    .badge { background: #333; padding: 4px 8px; border-radius: 12px; margin-right: 8px; display: inline-flex; align-items: center; color: #fff; }
    .badge button { border: none; background: none; margin-left: 6px; cursor: pointer; font-weight: bold; color: #fff; }
    .toolbar { margin-bottom: 15px; }
    .toolbar button { margin-right: 10px; padding: 6px 12px; font-size: 0.9em; cursor: pointer; background: #0055aa; color: white; border: none; border-radius: 5px; }
    .toolbar button:hover { background: #004080; }

/* Stili avanzati per il Riepilogo Stock */
    .tabella-riepilogo {
      width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;
    }
    .tabella-riepilogo th, .tabella-riepilogo td {
      border: 1px solid #ddd; padding: 8px; text-align: left; color: #333;
    }
    .tabella-riepilogo th { background-color: #003366; color: #ffffff; }

/* Stili generali Riepilogo Stock */
    .tabella-riepilogo {
      width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;
    }
    .tabella-riepilogo th, .tabella-riepilogo td {
      border: 1px solid #ddd; padding: 8px; text-align: left; color: #333;
    }
    .tabella-riepilogo th { background-color: #003366; color: #ffffff; }

    /* Layout mobile responsive senza accavallamenti */
    @media (max-width: 768px) {
      .modal-content {
        width: 95% !important;
        margin: 2% auto !important;
        padding: 12px !important;
        max-height: 88vh !important;
      }
      
      .tabella-riepilogo, .tabella-riepilogo thead, .tabella-riepilogo tbody, .tabella-riepilogo th, .tabella-riepilogo td, .tabella-riepilogo tr {
        display: block !important;
        width: 100% !important;
        box-sizing: border-box;
      }
      
      .tabella-riepilogo thead {
        display: none !important; /* Nasconde l'intestazione orizzontale su mobile */
      }
      
      .tabella-riepilogo tr {
        margin-bottom: 16px;
        background: #ffffff;
        border: 2px solid #003366;
        border-radius: 8px;
        padding: 10px 12px;
        box-shadow: 0 3px 6px rgba(0,0,0,0.12);
      }
      
      .tabella-riepilogo td {
        display: flex !important;
        flex-direction: column !important; /* Dispone etichetta e valore in verticale per evitare sovrapposizioni */
        align-items: flex-start !important;
        padding: 6px 0 !important;
        border: none !important;
        border-bottom: 1px solid #eef2f5 !important;
        font-size: 13px !important;
        text-align: left !important;
        line-height: 1.4;
      }
      
      .tabella-riepilogo td:last-child {
        border-bottom: none !important;
      }

      /* Definizione etichette su mobile */
      .tabella-riepilogo td:nth-child(1)::before { content: "Tipo Veicolo:"; font-weight: bold; color: #003366; margin-bottom: 2px; }
      .tabella-riepilogo td:nth-child(2)::before { content: "Descrizione:"; font-weight: bold; color: #003366; margin-bottom: 2px; }
      .tabella-riepilogo td:nth-child(3)::before { content: "Totale Stock:"; font-weight: bold; color: #003366; margin-bottom: 2px; }
      .tabella-riepilogo td:nth-child(4)::before { content: "di cui Status:"; font-weight: bold; color: #003366; margin-bottom: 2px; }
      .tabella-riepilogo td:nth-child(5)::before { content: "di cui Prenotati:"; font-weight: bold; color: #003366; margin-bottom: 2px; }
      .tabella-riepilogo td:nth-child(6)::before { content: "di cui Allestiti:"; font-weight: bold; color: #003366; margin-bottom: 2px; }
    }

	
@media (max-width: 768px) {
  header { flex-direction: column; align-items: flex-start; }
  .user-badge-container { width: 100%; justify-content: space-between; box-sizing: border-box; }
  .filtri { flex-direction: column; }
  .filtro { min-width: unset; width: 100%; }
  select { min-height: 60px; }
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tr { margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; background: white; color: black; padding: 10px; }
  td { position: relative; padding-left: 50%; text-align: left; border: none; border-bottom: 1px solid #eee; }
  td::before { content: attr(data-label); position: absolute; left: 10px; top: 6px; font-weight: bold; white-space: nowrap; }
}

@media (max-width: 480px) {
  body { padding: 10px; }
  .toolbar button { margin-bottom: 10px; width: 100%; }
  h1 { font-size: 1.4em; }
}

@media (max-width: 768px) {
  tbody tr { margin: 0 0 16px 0; padding: 8px 10px 4px; border: 2px solid #6f8da9; border-left: 6px solid #00a6d6; border-radius: 10px; background: #f7fbff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22); }
  tbody tr:nth-child(even) { background: #eaf3fb; }
  tbody tr.highlight { background: #ffe1e1 !important; border-color: #d9534f; border-left-color: #c62828; }
  tbody td { padding: 10px 6px 10px 48%; border: none; border-bottom: 1px solid #c8d7e5; line-height: 1.35; overflow-wrap: anywhere; }
  tbody td:last-child { border-bottom: none; }
  tbody td::before { left: 6px; top: 10px; width: 43%; color: #17476e; font-size: 0.92em; line-height: 1.25; white-space: normal; }
}

/* Modali generali */
.modal-overlay {
  display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.5);
}
.modal-content {
  background-color: #fff; margin: 5% auto; padding: 20px 30px; width: 80%;
  max-width: 900px; border-radius: 12px; font-family: Arial, sans-serif;
  box-shadow: 0 0 20px rgba(0,0,0,0.2); color: #333; max-height: 80vh; overflow-y: auto;
}
.modal-content h2 { margin-top: 0; font-size: 1.5em; border-bottom: 1px solid #ccc; padding-bottom: 10px; color: #123e63; }
.modal-content ul { list-style: none; padding: 0; margin: 0; }
.modal-content li { padding: 6px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #f0f0f0; }
.modal-content li strong { width: 40%; text-align: right; padding-right: 12px; color: #333; font-weight: bold; }
.modal-content li span { width: 60%; text-align: left; color: #555; }
.modal-content h3 { margin-top: 20px; font-size: 1.3em; color: #444; border-top: 1px solid #ccc; padding-top: 10px; }

.tabella-optional, .tabella-riepilogo {
  width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px;
}
.tabella-optional th, .tabella-optional td, .tabella-riepilogo th, .tabella-riepilogo td {
  border: 1px solid #ddd; padding: 8px; text-align: left; color: #333;
}
.tabella-optional th, .tabella-riepilogo th { background-color: #003366; color: #ffffff; }

/* Ottimizzazione specifica per il Riepilogo Stock su Smartphone */
@media (max-width: 768px) {
  .modal-content {
    width: 95% !important;
    margin: 2% auto !important;
    padding: 12px !important;
    max-height: 88vh !important;
  }
  .tabella-riepilogo {
    font-size: 12px !important;
  }
  .tabella-riepilogo th, .tabella-riepilogo td {
    padding: 6px 4px !important;
    word-break: break-word;
  }
}

.modale-doppia-colonna { display: flex; flex-wrap: wrap; gap: 20px; max-height: 80vh; overflow-y: auto; }
.colonna-sinistra, .colonna-destra { flex: 1 1 45%; font-size: 14px; }
.optional-wrapper { break-inside: avoid; page-break-inside: avoid; }
  </style>
</head>
<body>

<script>
    if (sessionStorage.getItem("isAuthorized") !== "true") {
        window.location.href = "index.html";
    }
</script>

  <header>
    <div>
      <h1>Socom Nuova Stock</h1>
      <div id="ultimo-aggiornamento">Ultimo aggiornamento: ...</div>
    </div>
    
    <!-- Badge Utente Loggato -->
    <div class="user-badge-container">
      <div class="user-badge-text">👤 Utente: <span id="nomeUtenteLogged">Ospite</span></div>
      <button class="btn-logout" onclick="logout()">Esci</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <button onclick="applicaFiltro()">Applica Filtro</button>
      <button onclick="resettaFiltro()">Reset Filtro</button>
      <button onclick="caricaDati()">Aggiorna</button>
    </div>

    <!-- Record trovati e pulsante Riepilogo -->
    <div class="status-bar">
      <div id="msg"></div>
      <button class="btn-riepilogo" onclick="apriRiepilogo()">📊 Riepilogo Stock</button>
    </div>

    <div id="filtri-attivi"></div>
    <div class="filtri" id="parametri"></div>
    <div id="tabella-container"></div>
  </main>

  <script>
    let BASE_URL = "";
    let URL_OPTIONAL = "";
    let URL_SCHEDE_PDF = "";
    let URL_LOG_SCRIPT = "";
    let ipUtentePubblico = "In rilevamento...";

    // Ottiene l'IP pubblico dell'utente all'avvio
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => { ipUtentePubblico = data.ip; })
      .catch(() => { ipUtentePubblico = "Non rilevato"; });

    const campiEsclusiFiltri = ["data_prenotazione","id_veicolo","VAN","telaio","versione","data_inserimento_ordine","data_arrivo","giorni_giacenza","data_arrivo_prevista","scadenza_prenot","cod_gomme_specifico","descr_gomme_specifico","cod_gomme_generico","descr_gomme_generico","data_ins_OCF","larghezza","listino_originale","prezzo_versione","prezzo_opt","cod_fdp2","aggiornamento_stock","cod_modello_vp","cod_tipologia_allestimento"];
    const campiDate = ["data_prenotazione","data_inserimento_ordine","data_arrivo","data_ins_OCF","data_arrivo_prevista","scadenza_prenot"];
    let intestazione = [], dati = [], datiCorrenti = []; 
    let optionalDati = []; let schedePdf = {};

    function formattaData(str) {
      if (!str) return "";
      const d = new Date(str);
      if (isNaN(d)) return str;
      const gg = String(d.getDate()).padStart(2,'0'),
            mm = String(d.getMonth()+1).padStart(2,'0'),
            yyyy = d.getFullYear();
      return `${gg}/${mm}/${yyyy}`;
    }

    function chiaveCampo(record, nomeCampo) {
      if (!record) return nomeCampo;
      if (Object.prototype.hasOwnProperty.call(record, nomeCampo)) return nomeCampo;
      const nomeMinuscolo = nomeCampo.toLowerCase();
      return Object.keys(record).find(k => k.toLowerCase() === nomeMinuscolo) || nomeCampo;
    }

    function pulisciTesto(str) {
      if (!str) return "";
      return String(str).replace(/^"+|"+$/g, '').trim();
    }

    function caricaDati() {
      fetch(BASE_URL + "?nocache=" + Date.now())
        .then(r => r.text())
        .then(testo => {
          const parsed = Papa.parse(testo.trim(), {
            delimiter: ";",
            header: true,
            skipEmptyLines: true
          });

          if (parsed.meta && parsed.meta.fields) {
            intestazione = parsed.meta.fields.map(pulisciTesto);
          } else {
            intestazione = [];
          }

          dati = parsed.data.map(row => {
            const newObj = {};
            Object.keys(row).forEach(k => {
              newObj[pulisciTesto(k)] = pulisciTesto(row[k]);
            });
            return newObj;
          });

          let ultimo = dati.find(r => r[chiaveCampo(r, "aggiornamento_stock")])?.[chiaveCampo(dati[0], "aggiornamento_stock")] || "";
          if (ultimo) document.getElementById("ultimo-aggiornamento").textContent = "Ultimo aggiornamento: " + ultimo;

          creaFiltri();
          datiCorrenti = [...dati];
          mostraTabella(datiCorrenti);
          mostraMessaggio(`${datiCorrenti.length} record trovati`);
        });
    }
	
    function caricaOptional() {
      fetch(URL_OPTIONAL + "?nocache=" + Date.now())
        .then(r => r.text())
        .then(text => {
          if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
          const parsed = Papa.parse(text.trim(), {
            delimiter: ";",
            header: true,
            skipEmptyLines: true
          });

          optionalDati = parsed.data.map(row => {
            const obj = {};
            Object.keys(row).forEach(k => obj[pulisciTesto(k)] = pulisciTesto(row[k]));
            return {
              codice: obj.optional || "",
              descrizione: obj.descrizione || "",
              prezzo: obj.prezzo || "",
              id_veicolo: obj.id_veicolo || ""
            };
          });
        })
        .catch(err => console.error("Errore fetch optional:", err));
    }

    function caricaSchedePdf() {
      return fetch(URL_SCHEDE_PDF + "?nocache=" + Date.now())
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(text => {
          if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
          const parsed = Papa.parse(text.trim(), {
            delimiter: ";",
            header: true,
            skipEmptyLines: true
          });

          schedePdf = {};
          parsed.data.forEach(row => {
            const id = pulisciTesto(row["id_veicolo"]);
            const url = pulisciTesto(row["url_pdf"]);
            if (id && url && /^https:\/\//i.test(url)) {
              schedePdf[id] = url;
            }
          });
        })
        .catch(err => console.error("Errore caricamento schede PDF:", err));
    }

    async function avviaConfigurazione() {
        try {
            const utente = sessionStorage.getItem("currentUser") || "Utente";
            document.getElementById("nomeUtenteLogged").textContent = utente;

            const res = await fetch("config.json?nocache=" + Date.now());
            if (!res.ok) throw new Error("Impossibile caricare la configurazione");
            const config = await res.json();
            
            BASE_URL = config.BASE_URL;
            URL_OPTIONAL = config.URL_OPTIONAL;
            URL_SCHEDE_PDF = config.URL_SCHEDE_PDF;
            URL_LOG_SCRIPT = config.URL_LOG_SCRIPT || "";

            if (URL_LOG_SCRIPT) {
                sessionStorage.setItem("URL_LOG_SCRIPT", URL_LOG_SCRIPT);
            }

            caricaDati();
            caricaOptional();
            caricaSchedePdf();
        } catch (err) {
            console.error("Errore nel caricamento della configurazione protetta:", err);
            document.getElementById("msg").textContent = "Errore di connessione ai dati protetti.";
        }
    }

    // Logout manuale
    async function logout() {
        const utente = sessionStorage.getItem("currentUser") || "Utente";
        const logUrl = URL_LOG_SCRIPT || sessionStorage.getItem("URL_LOG_SCRIPT");
        if (logUrl) {
            try {
                await fetch(logUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        utente: utente, 
                        note: "Disconnessione (Logout) | IP: " + ipUtentePubblico,
                        dispositivo: navigator.userAgent 
                    })
                });
            } catch(e) {
                console.error("Log logout non inviato:", e);
            }
        }

        sessionStorage.clear();
        window.location.href = "index.html";
    }

    // Invio log generico per attivita
    async function inviaLogAttivita(testoNota) {
        const utente = sessionStorage.getItem("currentUser") || "Utente";
        const logUrl = URL_LOG_SCRIPT || sessionStorage.getItem("URL_LOG_SCRIPT");
        if (logUrl) {
            try {
                fetch(logUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        utente: utente, 
                        note: testoNota + " | IP: " + ipUtentePubblico,
                        dispositivo: navigator.userAgent 
                    })
                });
            } catch(e) {
                console.error("Log attivita non inviato:", e);
            }
        }
    }

    // Tracciamento affidabile per chiusura scheda/browser
    function tracciaChiusura() {
        const utente = sessionStorage.getItem("currentUser");
        const logUrl = URL_LOG_SCRIPT || sessionStorage.getItem("URL_LOG_SCRIPT");
        
        if (utente && logUrl) {
            const payload = JSON.stringify({ 
                utente: utente, 
                note: "Chiusura scheda / abbandono pagina | IP: " + ipUtentePubblico,
                dispositivo: navigator.userAgent 
            });
            if (navigator.sendBeacon) {
                const blob = new Blob([payload], { type: "text/plain;charset=UTF-8" });
                navigator.sendBeacon(logUrl, blob);
            } else {
                fetch(logUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: payload,
                    keepalive: true
                });
            }
        }
    }

    window.addEventListener("pagehide", tracciaChiusura);
    window.addEventListener("beforeunload", tracciaChiusura);

    window.onload = () => {
        avviaConfigurazione();
    };

    function mostraDettagli(veicolo) {
      const modal = document.getElementById("dettagliModal");
      const contenuto = document.getElementById("contenutoDettagli");

      const idVeicolo = veicolo.id_veicolo || "N/D";
      let htmlSinistra = `<h2>Veicolo ID ${idVeicolo}</h2><ul class="lista-dettagli">`;
      const campiDaNascondereDettaglio = new Set([
        "cod_modello_vp", "famiglia_iveco", "versione", "data_inserimento_ordine",
        "data_arrivo", "data_prenotazione", "descr_fdp", "cod_fdp",
        "listino_originale", "prezzo_versione", "prezzo_opt",
        "cod_tipologia_allestimento", "cod_fdp2", "aggiornamento_stock"
      ]);

      intestazione.forEach(key => {
        if (key !== "id_veicolo" && !campiDaNascondereDettaglio.has(String(key).toLowerCase())) {
          let val = veicolo[key];
          if (campiDate.includes(key)) val = formattaData(val);
          if (!val) val = "—";
          val = String(val).replace(/</g, "&lt;").replace(/>/g, "&gt;");
          htmlSinistra += `<li><strong>${key}:</strong> <span>${val}</span></li>`;
        }
      });
      htmlSinistra += `</ul>`;

      const urlSchedaPdf = schedePdf[String(idVeicolo).trim()];
      if (urlSchedaPdf) {
        htmlSinistra += `<p style="margin-top:16px"><a href="${urlSchedaPdf}" target="_blank" rel="noopener noreferrer" onclick="inviaLogAttivita('Apertura/Download Dettagli Allestimento PDF - Veicolo ID: ${idVeicolo}')" style="display:inline-block;padding:10px 14px;background:#1769aa;color:white;text-decoration:none;border-radius:6px;font-weight:bold">📄 Dettagli allestimento</a></p>`;
      }

      let htmlDestra = "";
      const optional = optionalDati
        .filter(o => o.id_veicolo === veicolo.id_veicolo)
        .sort((a, b) => a.codice.localeCompare(b.codice));

      if (optional.length) {
         htmlDestra += `<h3>Optional:</h3><div class="optional-wrapper"><table class='tabella-optional'><thead><tr><th>Codice</th><th>Descrizione</th><th>Prezzo</th></tr></thead><tbody>`;
        optional.forEach(opt => {
          htmlDestra += `<tr><td>${opt.codice}</td><td>${opt.descrizione}</td><td>€${opt.prezzo}</td></tr>`;
        });
        htmlDestra += `</tbody></table></div>`;
      } else {
        htmlDestra += "<p><em>Nessun optional trovato.</em></p>";
      }

      contenuto.innerHTML = `<div class="modale-doppia-colonna"><div class="colonna-sinistra">${htmlSinistra}</div><div class="colonna-destra">${htmlDestra}</div></div>`;
      modal.style.display = "block";
    }

    function creaFiltri() {
      const div = document.getElementById("parametri"); div.innerHTML="";
      intestazione.forEach((col,i) => {
        if (campiEsclusiFiltri.includes(col)) return;
        const sel = document.createElement("select");
        sel.multiple = true;
        sel.setAttribute("data-col-index", i);
        [...new Set(dati.map(r=>r[col]).filter(Boolean))].sort().forEach(v=>{
          const o = document.createElement("option"); o.value=v; o.textContent=v;
          sel.append(o);
        });
        const l = document.createElement("label");
        l.className="filtro";
        l.innerHTML=`<strong>${col}</strong>`;
        l.appendChild(sel);
        div.appendChild(l);
      });
    }

    function mostraTabella(arr) {
      datiCorrenti = arr; 
      const colonneTabella = [
        { label: "id_veicolo", campo: "id_veicolo" },
        { label: "descrizione", campo: "descrizione" },
        { label: "des_colore", campo: "des_colore" },
        { label: "VAN", campo: "VAN" },
        { label: "Prenota via WhatsApp", whatsapp: true },
        { label: "TELAIO", campo: "TELAIO" },
        { label: "descri_status", campo: "descri_status" },
        { label: "stato_avanz_ordine", campo: "stato_avanz_ordine" },
        { label: "giorni_giacenza", campo: "giorni_giacenza" },
        { label: "data_arrivo_prevista", campo: "data_arrivo_prevista" },
        { label: "descr_passo", campo: "descr_passo" },
        { label: "note", campo: "note" },
        { label: "tipo_allestimento", campo: "tipo_allestimento" },
        { label: "Dettagli allestimento", scheda: true },
        { label: "prezzo_vendita_web", campo: "prezzo_vendita_web" },
        { label: "prenotato_da", campo: "prenotato_da" },
        { label: "scadenza_prenot", campo: "scadenza_prenot" },
        { label: "nota_pren", campo: "nota_pren" }
      ];

      const campiInGrassetto = new Set([
        "descrizione", "descri_status", "stato_avanz_ordine",
        "data_arrivo_prevista", "tipo_allestimento", "prezzo_vendita_web",
        "prenotato_da", "scadenza_prenot", "nota_pren"
      ]);

      function formattaPrezzoEuro(valore) {
        if (valore === null || valore === undefined || String(valore).trim() === "") return "";
        if (typeof valore === "number") {
          return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(valore);
        }
        let testo = String(valore).trim().replace(/€|\s/g, "");
        if (testo.includes(",")) {
          testo = testo.replace(/\./g, "").replace(",", ".");
        }
        const numero = Number(testo);
        if (!Number.isFinite(numero)) return String(valore);
        return new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(numero);
      }

      const cont = document.getElementById("tabella-container");
      const t = document.createElement("table");
      const thead = document.createElement("thead");
      const trh = document.createElement("tr");
      colonneTabella.forEach(col => {
        const th = document.createElement("th");
        th.textContent = col.label;
        trh.appendChild(th);
      });
      thead.appendChild(trh);
      t.appendChild(thead);

      const tbody = document.createElement("tbody");
      arr.forEach(r => {
        const tr = document.createElement("tr");
        if (r[chiaveCampo(r, "prenotato_da")]?.trim()) tr.classList.add("highlight");

        colonneTabella.forEach(col => {
          const td = document.createElement("td");
          td.setAttribute("data-label", col.label);

          if (col.whatsapp) {
            const van = String(r[chiaveCampo(r, "VAN")] || "").trim();
            const idVeicolo = String(r[chiaveCampo(r, "id_veicolo")] || "").trim();
            if (van) {
              const messaggio = `ciao, mi potresti prenotare il VAN ${van}`;
              const linkWhatsApp = document.createElement("a");
              linkWhatsApp.href = `https://wa.me/390812588214?text=${encodeURIComponent(messaggio)}`;
              linkWhatsApp.target = "_blank";
              linkWhatsApp.rel = "noopener noreferrer";
              linkWhatsApp.textContent = "💬 Prenota";
              linkWhatsApp.style.cssText = "display:inline-block;padding:6px 9px;background:#25D366;color:#fff;text-decoration:none;border-radius:5px;font-weight:bold;white-space:nowrap";
              
              linkWhatsApp.addEventListener("click", ev => {
                ev.stopPropagation();
                inviaLogAttivita(`Prenotazione WhatsApp cliccata - VAN: ${van} (ID: ${idVeicolo})`);
              });

              td.appendChild(linkWhatsApp);
            } else {
              td.textContent = "—";
            }
          } else if (col.scheda) {
            const idVeicolo = String(r[chiaveCampo(r, "id_veicolo")] || "").trim();
            const urlSchedaPdf = schedePdf[idVeicolo];
            if (urlSchedaPdf) {
              const link = document.createElement("a");
              link.href = urlSchedaPdf;
              link.target = "_blank";
              link.rel = "noopener noreferrer";
              link.textContent = "📄 Apri";
              link.style.cssText = "display:inline-block;padding:5px 9px;background:#1769aa;color:white;text-decoration:none;border-radius:5px;font-weight:bold;white-space:nowrap";
              
              link.addEventListener("click", ev => {
                ev.stopPropagation();
                inviaLogAttivita(`Apertura/Download Dettagli Allestimento PDF - Veicolo ID: ${idVeicolo}`);
              });

              td.appendChild(link);
            } else {
              td.textContent = "—";
            }
          } else {
            const chiave = chiaveCampo(r, col.campo);
            let v = r[chiave] || "";
            if (campiDate.some(c => c.toLowerCase() === col.campo.toLowerCase())) {
              v = formattaData(v);
            } else if (col.campo.toLowerCase() === "giorni_giacenza") {
              v = v ? Math.round(parseFloat(v)).toString() : "";
            } else if (col.campo.toLowerCase() === "prezzo_vendita_web") {
              v = formattaPrezzoEuro(v);
            }
            td.textContent = v;
            if (campiInGrassetto.has(col.campo.toLowerCase())) td.style.fontWeight = "bold";

            if (col.campo.toLowerCase() === "descrizione" && String(r[chiaveCampo(r, "tipo_allestimento")] || "").trim()) {
              const badge = document.createElement("span");
              badge.textContent = "Pronta consegna";
              badge.style.cssText = "display:inline-block;margin-left:7px;padding:3px 6px;background:#16803c;color:#fff;border-radius:4px;font-size:11px;font-weight:bold;white-space:nowrap";
              td.appendChild(document.createTextNode(" "));
              td.appendChild(badge);
            }
          }
          tr.appendChild(td);
        });
        tr.style.cursor = "pointer";
        tr.onclick = () => mostraDettagli(r);
        tbody.appendChild(tr);
      });
      t.appendChild(tbody);
      cont.innerHTML = "";
      cont.appendChild(t);
    }

    function mostraMessaggio(txt) { document.getElementById("msg").textContent = txt; }

    function aggiornaOpzioniFiltri() {
      const selects = Array.from(document.querySelectorAll(".filtri select"));
      selects.forEach(sel => {
        const idx = parseInt(sel.getAttribute("data-col-index"), 10);
        const col = intestazione[idx];
        const selezionati = Array.from(sel.selectedOptions).map(o => o.value);
        let compatibili = [...dati];

        selects.forEach(altro => {
          if (altro === sel) return;
          const idxAltro = parseInt(altro.getAttribute("data-col-index"), 10);
          const colAltro = intestazione[idxAltro];
          const valoriAltro = Array.from(altro.selectedOptions).map(o => o.value);
          if (valoriAltro.length) {
            compatibili = compatibili.filter(r => valoriAltro.includes(r[colAltro]));
          }
        });

        const valoriDisponibili = new Set(compatibili.map(r => r[col]).filter(v => v !== undefined && v !== null && String(v) !== ""));
        selezionati.forEach(v => valoriDisponibili.add(v));
        const ordinati = Array.from(valoriDisponibili).sort((a, b) => String(a).localeCompare(String(b), "it"));

        sel.innerHTML = "";
        ordinati.forEach(v => {
          const opzione = document.createElement("option");
          opzione.value = v;
          opzione.textContent = v;
          opzione.selected = selezionati.includes(v);
          sel.appendChild(opzione);
        });
      });
    }

    function applicaFiltro() {
      const filtriNodo = document.getElementById("filtri-attivi");
      filtriNodo.innerHTML = "";
      let arr = [...dati];
      let descrizioniFiltri = [];

      document.querySelectorAll(".filtri select").forEach(sel => {
        const idx = parseInt(sel.getAttribute("data-col-index"), 10);
        const col = intestazione[idx];
        const selvals = Array.from(sel.selectedOptions).map(o => o.value);
        if (selvals.length > 0) {
          arr = arr.filter(r => selvals.includes(r[col]));
          descrizioniFiltri.push(`${col}: [${selvals.join(", ")}]`);

          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = `${col}: ${selvals.join(", ")}`;
          const btn = document.createElement("button");
          btn.textContent = "×";
          btn.title = "Rimuovi questo filtro";
          btn.onclick = () => {
            selvals.forEach(v => {
              for (const o of sel.options) if (o.value === v) o.selected = false;
            });
            applicaFiltro();
          };
          badge.append(btn);
          filtriNodo.append(badge);
        }
      });

      if (descrizioniFiltri.length > 0) {
        inviaLogAttivita("Filtro applicato: " + descrizioniFiltri.join(" | "));
      } else {
        inviaLogAttivita("Filtro applicato: (Nessun filtro selezionato - Mostra tutti)");
      }

      aggiornaOpzioniFiltri();
      mostraTabella(arr);
      mostraMessaggio(`${arr.length} record trovati`);
    }

    function resettaFiltro() {
      document.querySelectorAll(".filtri select").forEach(s => {
        Array.from(s.options).forEach(o => o.selected = false);
      });
      document.getElementById("filtri-attivi").textContent = "";
      
      inviaLogAttivita("Reset filtri effettuato");

      aggiornaOpzioniFiltri();
      mostraTabella(dati);
      mostraMessaggio(`${dati.length} record trovati`);
    }

    // --- TABELLA DI RIEPILOGO STOCK ---
    function apriRiepilogo() {
      const modal = document.getElementById("riepilogoModal");
      const cont = document.getElementById("contenutoRiepilogo");

      const mappaRiepilogo = {};

      datiCorrenti.forEach(r => {
        const tipoVeicolo = r[chiaveCampo(r, "tipo_veicolo")]?.trim() || "—";
        const descrizione = r[chiaveCampo(r, "descrizione")]?.trim() || "N/D";
        const status = r[chiaveCampo(r, "descri_status")]?.trim() || "N/D";
        const tipoAllestimento = r[chiaveCampo(r, "tipo_allestimento")]?.trim() || "";
        const prenotatoDa = r[chiaveCampo(r, "prenotato_da")]?.trim() || "";

        const chiaveGroup = `${tipoVeicolo}___${descrizione}`;

        if (!mappaRiepilogo[chiaveGroup]) {
          mappaRiepilogo[chiaveGroup] = {
            tipo_veicolo: tipoVeicolo,
            descrizione: descrizione,
            totale: 0,
            status_map: {},
            prenotati: 0,
            allestiti: 0
          };
        }

        const gruppo = mappaRiepilogo[chiaveGroup];
        gruppo.totale += 1;

        gruppo.status_map[status] = (gruppo.status_map[status] || 0) + 1;

        if (prenotatoDa !== "") {
          gruppo.prenotati += 1;
        }

        if (tipoAllestimento !== "" && tipoAllestimento !== "—") {
          gruppo.allestiti += 1;
        }
      });

      const listaOrdinata = Object.values(mappaRiepilogo).sort((a, b) => {
        const compTipo = a.tipo_veicolo.localeCompare(b.tipo_veicolo, "it");
        if (compTipo !== 0) return compTipo;
        return a.descrizione.localeCompare(b.descrizione, "it");
      });

      let html = `
        <table class="tabella-riepilogo">
          <thead>
            <tr>
              <th>Tipo Veicolo</th>
              <th>Descrizione</th>
              <th>Totale</th>
              <th>di cui Status</th>
              <th>di cui Prenotati</th>
              <th>di cui Allestiti</th>
            </tr>
          </thead>
          <tbody>
      `;

      if (listaOrdinata.length === 0) {
        html += `<tr><td colspan="6" style="text-align:center;">Nessun dato disponibile.</td></tr>`;
      } else {
        listaOrdinata.forEach(item => {
          const stringaStatus = Object.entries(item.status_map)
            .map(([st, count]) => `• ${st}: <strong>${count}</strong>`)
            .join("<br>");

          html += `
            <tr>
              <td><strong>${item.tipo_veicolo}</strong></td>
              <td>${item.descrizione}</td>
              <td style="text-align:center;"><strong>${item.totale}</strong></td>
              <td>${stringaStatus}</td>
              <td style="text-align:center; font-weight:bold; color:${item.prenotati > 0 ? '#c62828' : 'inherit'};">${item.prenotati}</td>
              <td style="text-align:center; font-weight:bold; color:${item.allestiti > 0 ? '#16803c' : 'inherit'};">${item.allestiti}</td>
            </tr>
          `;
        });
      }

      html += `</tbody></table>`;
      cont.innerHTML = html;
      modal.style.display = "block";
    }

    function stampaModale() {
      const contenuto = document.getElementById('contenutoDettagli').innerHTML;
      const finestraStampa = window.open('', '', 'width=900,height=700');
      if (!finestraStampa) {
        alert('Consenti l’apertura della finestra di stampa per proseguire.');
        return;
      }

      finestraStampa.document.write(`
        <!DOCTYPE html>
        <html lang="it">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Scheda veicolo</title>
            <style>
              * { box-sizing: border-box; }
              body { font-family: Arial, Helvetica, sans-serif; color: #243447; background: #fff; margin: 0; padding: 18px; font-size: 14px; line-height: 1.45; }
              .modale-doppia-colonna { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
              .colonna-sinistra, .colonna-destra { min-width: 0; background: #fff; }
              h2 { margin: 0 0 14px; padding: 0 0 10px; color: #123e63; font-size: 22px; border-bottom: 3px solid #00a6d6; }
              h3 { margin: 4px 0 12px; padding: 9px 12px; color: #123e63; font-size: 17px; background: #eaf4fb; border-left: 4px solid #00a6d6; border-radius: 4px; }
              .lista-dettagli { list-style: none; padding: 0; margin: 0; }
              .lista-dettagli li { display: grid; grid-template-columns: minmax(115px, 42%) minmax(0, 1fr); gap: 10px; padding: 8px 10px; margin: 0; border-bottom: 1px solid #e4ebf0; overflow-wrap: anywhere; }

              .tabella-optional { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
              .tabella-optional th, .tabella-optional td { border: 1px solid #d6e0e8; padding: 8px; text-align: left; overflow-wrap: anywhere; }

              .tabella-optional tbody tr:nth-child(even) { background: #f5f9fc; }
              a { color: #075b96; }
            </style>
          </head>
          <body>${contenuto}</body>
        </html>
      `);
      finestraStampa.document.close();
      finestraStampa.focus();
      setTimeout(() => finestraStampa.print(), 300);
    }
  </script>
