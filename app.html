<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121e2d" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <title>Socom Nuova Stock</title>
  <style>
    /* Stili generali */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #121e2d; color: white; }
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    h1 { margin: 0; font-size: 2em; color: #00bfff; }
    #ultimo-aggiornamento { font-size: 0.9em; color: #cccccc; margin-top: 4px; }
    
    /* Box utente loggato nell'header */
    .user-badge-container { display: flex; align-items: center; gap: 10px; background: #1c2d42; padding: 8px 14px; border-radius: 8px; border: 1px solid #0055aa; }
    .user-badge-text { font-size: 0.9em; color: #00e5ff; font-weight: bold; }
    .btn-logout { background: #d32f2f; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
    .btn-logout:hover { background: #b71c1c; }

    /* Barra di Navigazione Separata per Contratti */
    .nav-bar-sezione { margin: 10px 0 20px 0; display: flex; justify-content: flex-start; }
    .btn-contratti-nav {
      background: #16803c;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9em;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: background 0.2s;
    }
    .btn-contratti-nav:hover { background: #12632e; }

    /* Filtri a Caselle di Spunta (Checkbox box unificati) */
    .filtri { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
    .filtro { display: flex; flex-direction: column; min-width: 180px; flex: 1; max-width: 300px; }
    .filtro-box {
      background: #f8f8f8;
      border: 1px solid #ccc;
      border-radius: 6px;
      max-height: 120px;
      overflow-y: auto;
      padding: 8px 10px;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .filtro-box label {
      font-weight: normal;
      font-size: 0.9em;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #333;
    }
    .filtro-box input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }
    
    /* Input di Ricerca Diretta */
    .search-container { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-input {
      padding: 10px 14px;
      font-size: 15px;
      border: 2px solid #0055aa;
      border-radius: 6px;
      width: 100%;
      max-width: 350px;
      background: #ffffff;
      color: #333;
      box-sizing: border-box;
    }
    .search-input:focus {
      outline: none;
      border-color: #00bfff;
      box-shadow: 0 0 8px rgba(0, 191, 255, 0.4);
    }

    /* Tabella Principale */
    #tabella-container table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; background: white; color: black; table-layout: auto; }
    #tabella-container th, #tabella-container td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    #tabella-container th { background: #003366; color: white; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
    #tabella-container td { white-space: normal; }
    #tabella-container tr.highlight { background-color: #fdd !important; }
    
    /* Area messaggi e pulsante riepilogo in alto */
    .status-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    #msg { font-weight: bold; color: #fff; }
    .btn-riepilogo { padding: 6px 12px; font-size: 0.9em; cursor: pointer; background: #16803c; color: white; border: none; border-radius: 5px; font-weight: bold; }
    .btn-riepilogo:hover { background: #126530; }

    #filtri-attivi { margin-bottom: 15px; font-style: italic; color: #ffcccc; font-weight: bold; }
    .badge { background: #d32f2f; padding: 4px 8px; border-radius: 12px; margin-right: 8px; display: inline-flex; align-items: center; color: #fff; font-weight: bold; }
    .badge button { border: none; background: none; margin-left: 6px; cursor: pointer; font-weight: bold; color: #fff; font-size: 14px; }
    
    .toolbar { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
    .toolbar button { padding: 6px 12px; font-size: 0.9em; cursor: pointer; background: #0055aa; color: white; border: none; border-radius: 5px; font-weight: bold; }
    .toolbar button:hover { background: #004080; }
	
/* Responsive Tabella Principale su Mobile */
@media (max-width: 768px) {
  header { flex-direction: column; align-items: flex-start; }
  .user-badge-container { width: 100%; justify-content: space-between; box-sizing: border-box; }
  .nav-bar-sezione { width: 100%; }
  .btn-contratti-nav { width: 100%; justify-content: center; padding: 10px 0; box-sizing: border-box; }
  .filtri { flex-direction: column; }
  .filtro { max-width: 100%; width: 100%; }
  .filtro-box { max-height: 100px; }
  .search-input { max-width: 100%; }
  
  #tabella-container table, #tabella-container thead, #tabella-container tbody, #tabella-container th, #tabella-container td, #tabella-container tr { display: block; }
  #tabella-container thead { display: none; }
  #tabella-container tbody tr { margin: 0 0 16px 0; padding: 8px 10px 4px; border: 2px solid #6f8da9; border-left: 6px solid #00a6d6; border-radius: 10px; background: #f7fbff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22); }
  #tabella-container tbody tr:nth-child(even) { background: #eaf3fb; }
  #tabella-container tbody tr.highlight { background: #ffe1e1 !important; border-color: #d9534f; border-left-color: #c62828; }
  #tabella-container tbody td { position: relative; padding: 10px 6px 10px 48%; border: none; border-bottom: 1px solid #c8d7e5; line-height: 1.35; overflow-wrap: anywhere; text-align: left; }
  #tabella-container tbody td:last-child { border-bottom: none; }
  #tabella-container tbody td::before { content: attr(data-label); position: absolute; left: 6px; top: 10px; width: 43%; color: #17476e; font-size: 0.92em; line-height: 1.25; white-space: normal; font-weight: bold; }
}

@media (max-width: 480px) {
  body { padding: 10px; }
  .toolbar button { margin-bottom: 5px; width: 100%; }
  h1 { font-size: 1.4em; }
}

/* Modali generali */
.modal-overlay {
  display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
  background-color: rgba(0,0,0,0.5);
}
.modal-content {
  background-color: #fff; margin: 5% auto; padding: 20px 30px; width: 80%;
  max-width: 950px; border-radius: 12px; font-family: Arial, sans-serif;
  box-shadow: 0 0 20px rgba(0,0,0,0.2); color: #333; max-height: 80vh; overflow-y: auto;
}
.modal-content h2 { margin-top: 0; font-size: 1.5em; border-bottom: 1px solid #ccc; padding-bottom: 10px; color: #123e63; }
.modal-content ul { list-style: none; padding: 0; margin: 0; }
.modal-content li { padding: 6px 0; display: flex; justify-content: space-between; border-bottom: 1px solid #f0f0f0; }
.modal-content li strong { width: 40%; text-align: right; padding-right: 12px; color: #333; font-weight: bold; }
.modal-content li span { width: 60%; text-align: left; color: #555; }
.modal-content h3 { margin-top: 20px; font-size: 1.3em; color: #444; border-top: 1px solid #ccc; padding-top: 10px; }

/* Contenitore con scorrimento orizzontale per la Tabella di Riepilogo */
.table-responsive-wrapper {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  margin-top: 10px;
}

.tabella-optional, .tabella-riepilogo {
  width: 100%; border-collapse: collapse; font-size: 14px; min-width: 650px;
}
.tabella-optional th, .tabella-optional td, .tabella-riepilogo th, .tabella-riepilogo td {
  border: 1px solid #ddd; padding: 10px 8px; text-align: left; color: #333; vertical-align: top;
}
.tabella-optional th, .tabella-riepilogo th { 
  background-color: #003366; color: #ffffff; white-space: nowrap; font-size: 13px;
}

@media (max-width: 768px) {
  .modal-content {
    width: 95% !important;
    margin: 3% auto !important;
    padding: 12px !important;
    max-height: 88vh !important;
  }
}

.modale-doppia-colonna { display: flex; flex-wrap: wrap; gap: 20px; max-height: 80vh; overflow-y: auto; }
.colonna-sinistra, .colonna-destra { flex: 1 1 45%; font-size: 14px; }
.optional-wrapper { break-inside: avoid; page-break-inside: avoid; }
  </style>
</head>
<body>

<script>
    if (sessionStorage.getItem("isAuthorized") !== "true") {
        window.location.href = "index.html";
    }
</script>

<header>
  <div>
    <h1>Socom Nuova Stock</h1>
    <div id="ultimo-aggiornamento">Caricamento data ultimo aggiornamento...</div>
  </div>
  
  <div class="user-badge-container">
    <div class="user-badge-text">👤 Utente: <span id="nomeUtenteLogged">Ospite</span> (<span id="ruoloUtenteLabel"></span>)</div>
    <button class="btn-logout" onclick="logout()">Esci</button>
  </div>
</header>

<!-- Barra di Navigazione Separata -->
<div class="nav-bar-sezione">
  <a href="contratti.html" class="btn-contratti-nav" onclick="logNavigazioneContratti(event)">
    📋 Contratti con veicoli in arrivo
  </a>
</div>

  <main>
    <div class="toolbar">
      <button onclick="resettaFiltro()">Reset Filtro</button>
      <button onclick="caricaDati()">Aggiorna</button>
      <button onclick="toggleColonneExtra()" id="btnExtraCols" style="background: #1769aa;">📈 Mostra e Nascondi Listini e data ordine</button>
    </div>

    <!-- Campo Ricerca Diretta (VAN / Telaio / Testo) -->
    <div class="search-container">
      <input 
        type="text" 
        id="input-ricerca-diretta" 
        class="search-input" 
        placeholder="🔍 Cerca VAN, Telaio o Descrizione..." 
        oninput="applicaFiltro()"
      >
    </div>

    <!-- Record trovati e pulsante Riepilogo Selezione -->
    <div class="status-bar">
      <div id="msg"></div>
      <button class="btn-riepilogo" onclick="apriRiepilogo()">📊 Riepilogo Selezione</button>
    </div>

    <div id="filtri-attivi"></div>

    <!-- Sezione Filtri Principali -->
    <div style="margin-bottom: 8px; font-weight: bold; color: #00bfff; font-size: 0.95em;">📌 Filtri Principali</div>
    <div class="filtri" id="parametri-principali"></div>

    <!-- Pulsante per Mostrare/Nascondere i Filtri Secondari -->
    <div style="margin: 15px 0 12px 0;">
      <button id="btn-toggle-secondari" onclick="toggleFiltriSecondari()" style="background: #1c2d42; color: #00e5ff; border: 1px solid #0055aa; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.88em; display: inline-flex; align-items: center; gap: 6px;">
        🔽 Mostra Filtri Secondari
      </button>
    </div>

    <!-- Sezione Filtri Secondari (A scomparsa) -->
    <div id="box-secondari" style="display: none; background: #182535; padding: 12px; border-radius: 8px; border: 1px dashed #0055aa; margin-bottom: 15px;">
      <div style="margin-bottom: 10px; font-weight: bold; color: #94a3b8; font-size: 0.9em;">⚙️ Filtri Secondari</div>
      <div class="filtri" id="parametri-secondari"></div>
    </div>

    <div id="tabella-container"></div>
  </main>

  <script>
    let BASE_URL = "";
    let URL_OPTIONAL = "";
    let URL_SCHEDE_PDF = "";
    let URL_LOG_SCRIPT = "";
    let ipUtentePubblico = "In rilevamento...";
    let mostraColonneExtra = false;

    // Recupero Ruolo e Utente dalla sessione
    const userRole = sessionStorage.getItem("userRole") || "agente";
    const currentUser = sessionStorage.getItem("currentUser") || "Ospite";

    // Campi definiti come Filtri Principali
    const campiPrincipali = [
      "des_marca", "tipo_veicolo", "descr_passo", "descr_versione", 
      "descri_status", "descrizione", "prenotato_da", "tipo_allestimento"
    ];

    // Funzione per estrarre ed evidenziare il Model Year (MY) dalla descrizione
    function estraiModelYear(descrizione) {
      if (!descrizione) return null;
      const regex = /MY[\s\.]*(\d{2,4})/i;
      const match = descrizione.match(regex);
      if (match) {
        const annoStr = match[1];
        const annoFormattato = annoStr.length === 2 ? "20" + annoStr : annoStr;
        return `MY${annoFormattato.slice(-2)}`;
      }
      return null;
    }

    // Toggle Mostra/Nascondi Listini e Data Ordine
    function toggleColonneExtra() {
      mostraColonneExtra = !mostraColonneExtra;
      const btn = document.getElementById("btnExtraCols");
      
      if (mostraColonneExtra) {
        btn.style.background = "#c62828";
        btn.textContent = "📉 Nascondi Listini e data ordine";
        inviaLogAttivita("Visualizzazione colonne extra (Listini e data ordine) attivata");
      } else {
        btn.style.background = "#1769aa";
        btn.textContent = "📈 Mostra e Nascondi Listini e data ordine";
        inviaLogAttivita("Visualizzazione colonne extra (Listini e data ordine) disattivata");
      }
      
      mostraTabella(datiCorrenti);
    }

    // Toggle per mostrare/nascondere la sezione filtri secondari
    function toggleFiltriSecondari() {
      const box = document.getElementById("box-secondari");
      const btn = document.getElementById("btn-toggle-secondari");
      if (box.style.display === "none") {
        box.style.display = "block";
        btn.innerHTML = "🔼 Nascondi Filtri Secondari";
      } else {
        box.style.display = "none";
        btn.innerHTML = "🔽 Mostra Filtri Secondari";
      }
    }

    // Apri PDF in modale interna e gestione download pulita senza schermate bianche su iOS
    function apriPdfOttimizzato(urlOriginale) {
      if (!urlOriginale) return;

      const urlViewer = "https://docs.google.com/viewer?embedded=true&url=" + encodeURIComponent(urlOriginale);
      
      let pdfModal = document.getElementById("pdfViewerModal");
      if (!pdfModal) {
        pdfModal = document.createElement("div");
        pdfModal.id = "pdfViewerModal";
        pdfModal.className = "modal-overlay";
        pdfModal.innerHTML = `
          <div class="modal-content" style="height: 90vh; max-height: 90vh; display: flex; flex-direction: column; padding: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px;">
              <h3 style="margin:0; font-size: 1.1em; color: #123e63;">📄 Dettagli Allestimento PDF</h3>
              <div style="display: flex; gap: 8px;">
                <button id="btnDownloadPdf" onclick="scaricaPdfSicuro()" style="background: #16803c; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9em; display: inline-flex; align-items: center;">📥 Scarica / Salva</button>
                <button onclick="chiudiPdfModale()" style="background: #d32f2f; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">Chiudi ×</button>
              </div>
            </div>
            <div style="flex: 1; position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 6px; border: 1px solid #ccc;">
              <iframe id="pdfIframe" style="width: 100%; height: 100%; border: none;" src="about:blank"></iframe>
            </div>
          </div>
        `;
        document.body.appendChild(pdfModal);
      }

      window._correntePdfUrl = urlOriginale;
      const iframe = document.getElementById("pdfIframe");
      iframe.src = urlViewer;
      pdfModal.style.display = "block";
    }

    function logNavigazioneContratti(e) {
      if (e) e.preventDefault();
      window.onbeforeunload = null;

      const logUrl = URL_LOG_SCRIPT || sessionStorage.getItem("URL_LOG_SCRIPT");

      if (logUrl) {
        fetch(logUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            utente: currentUser,
            note: "Navigazione verso Contratti con veicoli in arrivo | IP: " + ipUtentePubblico,
            dispositivo: navigator.userAgent
          })
        }).finally(() => {
          window.location.href = "contratti.html";
        });
      } else {
        window.location.href = "contratti.html";
      }
    }
	  
    async function scaricaPdfSicuro() {
      const url = window._correntePdfUrl;
      if (!url) return;

      if (navigator.share && /iPad|iPhone|iPod/.test(navigator.userAgent)) {
        try {
          await navigator.share({
            title: 'Scheda Allestimento Veicolo',
            url: url
          });
          return;
        } catch (e) {}
      }

      try {
        const response = await fetch(url);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = blobUrl;
        a.download = 'Allestimento_Veicolo.pdf';
        document.body.appendChild(a);
        a.click();
        
        window.URL.revokeObjectURL(blobUrl);
        document.body.removeChild(a);
      } catch (err) {
        window.open(url, '_system');
      }
    }

    function chiudiPdfModale() {
      const pdfModal = document.getElementById("pdfViewerModal");
      const iframe = document.getElementById("pdfIframe");
      if (iframe) iframe.src = "about:blank";
      if (pdfModal) pdfModal.style.display = "none";
    }
	  
    // --- TIMEOUT DI INATTIVITÀ (1 ORA) ---
    const TIMEOUT_INATTIVITA_MS = 60 * 60 * 1000;
    let timerInattivita;

    function resetTimerInattivita() {
      clearTimeout(timerInattivita);
      timerInattivita = setTimeout(logoutPerInattivita, TIMEOUT_INATTIVITA_MS);
    }

    async function logoutPerInattivita() {
      const logUrl = URL_LOG_SCRIPT || sessionStorage.getItem("URL_LOG_SCRIPT");
      if (logUrl) {
        try {
          await fetch(logUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
              utente: currentUser, 
              note: "Disconnessione automatica per inattività (1 ora) | IP: " + ipUtentePubblico,
              dispositivo: navigator.userAgent 
            })
          });
        } catch(e) {}
      }

      sessionStorage.clear();
      alert("Sessione scaduta per inattività (1 ora). Verrai reindirizzato alla schermata di login.");
      window.location.href = "index.html";
    }

    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, resetTimerInattivita, true);
    });

    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => { ipUtentePubblico = data.ip; })
      .catch(() => { ipUtentePubblico = "Non rilevato"; });

    const campiEsclusiFiltri = [
      "id_veicolo", "VAN", "telaio", "versione", "giorni_giacenza",
      "cod_gomme_specifico", "descr_gomme_specifico", "cod_gomme_generico", "descr_gomme_generico",
      "larghezza", "listino_originale", "prezzo_versione", "prezzo_opt", "cod_fdp2",
      "aggiornamento_stock", "cod_modello_vp", "cod_tipologia_allestimento",
      "data_inserimento_ord", "data_arr", "data_arrivo_prev", "data_prenot", "scadenza_pren", "data_ins_OCF"
    ];

    const campiDate = ["data_inserimento_ord", "data_arr", "data_arrivo_prev", "data_prenot", "scadenza_pren", "data_ins_OCF"];

    let intestazione = [], dati = [], datiCorrenti = []; 
    let optionalDati = []; let schedePdf = {};

    function formattaData(str) {
      if (!str) return "";
      str = String(str).trim();
      
      if (str.includes("/")) {
        const parti = str.split(" ")[0].split("/");
        if (parti.length === 3) {
          const gg = parti[0].padStart(2, '0');
          const mm = parti[1].padStart(2, '0');
          const yyyy = parti[2];
          return `${gg}/${mm}/${yyyy}`;
        }
      }
      
      const d = new Date(str);
      if (isNaN(d)) return str;
      const gg = String(d.getDate()).padStart(2,'0'),
            mm = String(d.getMonth()+1).padStart(2,'0'),
            yyyy = d.getFullYear();
      return `${gg}/${mm}/${yyyy}`;
    }

    function chiaveCampo(record, nomeCampo) {
      if (!record) return nomeCampo;
      if (Object.prototype.hasOwnProperty.call(record, nomeCampo)) return nomeCampo;
      const nomeMinuscolo = nomeCampo.toLowerCase();
      return Object.keys(record).find(k => k.toLowerCase() === nomeMinuscolo) || nomeCampo;
    }

    function pulisciTesto(str) {
      if (!str) return "";
      return String(str).replace(/^"+|"+$/g, '').trim();
    }

    function caricaDati() {
      fetch(BASE_URL + "?nocache=" + Date.now())
        .then(r => r.text())
        .then(testo => {
          const parsed = Papa.parse(testo.trim(), {
            delimiter: ";",
            header: true,
            skipEmptyLines: true
          });

          if (parsed.meta && parsed.meta.fields) {
            intestazione = parsed.meta.fields.map(pulisciTesto);
          } else {
            intestazione = [];
          }

          dati = parsed.data.map(row => {
            const newObj = {};
            Object.keys(row).forEach(k => {
              newObj[pulisciTesto(k)] = pulisciTesto(row[k]);
            });
            return newObj;
          });

          let ultimo = dati.find(r => r[chiaveCampo(r, "aggiornamento_stock")])?.[chiaveCampo(dati[0], "aggiornamento_stock")] || "";
          if (ultimo) document.getElementById("ultimo-aggiornamento").textContent = "Ultimo aggiornamento: " + ultimo;

          creaFiltri();
          datiCorrenti = [...dati];
          mostraTabella(datiCorrenti);
          mostraMessaggio(`${datiCorrenti.length} record trovati`);
        });
    }
	
    function caricaOptional() {
      fetch(URL_OPTIONAL + "?nocache=" + Date.now())
        .then(r => r.text())
        .then(text => {
          if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
          const parsed = Papa.parse(text.trim(), {
            delimiter: ";",
            header: true,
            skipEmptyLines: true
          });

          optionalDati = parsed.data.map(row => {
            const obj = {};
            Object.keys(row).forEach(k => obj[pulisciTesto(k)] = pulisciTesto(row[k]));
            return {
              codice: obj.optional || "",
              descrizione: obj.descrizione || "",
              prezzo: obj.prezzo || "",
              id_veicolo: obj.id_veicolo || ""
            };
          });
        })
        .catch(err => console.error("Errore fetch optional:", err));
    }

    function caricaSchedePdf() {
      return fetch(URL_SCHEDE_PDF + "?nocache=" + Date.now())
        .then(r => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(text => {
          if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
          const parsed = Papa.parse(text.trim(), {
            delimiter: ";",
            header: true,
            skipEmptyLines: true
          });

          schedePdf = {};
          parsed.data.forEach(row => {
            const id = pulisciTesto(row["id_veicolo"]);
            const url = pulisciTesto(row["url_pdf"]);
            if (id && url && /^https:\/\//i.test(url)) {
              schedePdf[id] = url;
            }
          });
        })
        .catch(err => console.error("Errore caricamento schede PDF:", err));
    }

    async function avviaConfigurazione() {
        try {

            document.getElementById("nomeUtenteLogged").textContent = currentUser;
            document.getElementById("ruoloUtenteLabel").textContent = userRole.toUpperCase();

            // PROFILAZIONE RUOLO AGENTE: Nasconde il pulsante listini
            if (userRole === "agente") {
                const btnExtra = document.getElementById("btnExtraCols");
                if (btnExtra) btnExtra.style.display = "none";
            }

            const res = await fetch("config.json?nocache=" + Date.now());
            if (!res.ok) throw new Error("Impossibile caricare la configurazione");
            const config = await res.json();
            
            BASE_URL = config.BASE_URL;
            URL_OPTIONAL = config.URL_OPTIONAL;
            URL_SCHEDE_PDF = config.URL_SCHEDE_PDF;
            URL_LOG_SCRIPT = config.URL_LOG_SCRIPT || "";

            if (URL_LOG_SCRIPT) {
                sessionStorage.setItem("URL_LOG_SCRIPT", URL_LOG_SCRIPT);
            }

            caricaDati();
            caricaOptional();
            caricaSchedePdf();

            document.getElementById("msg").textContent = "Errore di connessione ai dati protetti.";

    function tracciaChiusura() {

        if (currentUser && logUrl) {
            const payload = JSON.stringify({ 
                utente: currentUser, 
                note: "Chiusura scheda / abbandono pagina | IP: " + ipUtentePubblico,
                dispositivo: navigator.userAgent 
            });
            if (navigator.sendBeacon) {
                const blob = new Blob([payload], { type: "text/plain;charset=UTF-8" });
                navigator.sendBeacon(logUrl, blob);
            } else {
                fetch(logUrl, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: payload,
                    keepalive: true
                });

        }
        const numero = Number(testo);

    function aggiornaOpzioniFiltri() {
      const boxes = Array.from(document.querySelectorAll(".filtro-box"));
      boxes.forEach(box => {
        const idx = parseInt(box.getAttribute("data-col-index"), 10);
        const col = intestazione[idx];
        const checkboxes = Array.from(box.querySelectorAll("input[type='checkbox']"));
        const selezionati = checkboxes.filter(chk => chk.checked).map(chk => chk.value);
        
        let compatibili = [...dati];
        boxes.forEach(altroBox => {
          if (altroBox === box) return;
          const idxAltro = parseInt(altroBox.getAttribute("data-col-index"), 10);
          const colAltro = intestazione[idxAltro];
          const valoriAltro = Array.from(altroBox.querySelectorAll("input[type='checkbox']"))
                                   .filter(c => c.checked)
                                   .map(c => c.value);
          if (valoriAltro.length) {
            compatibili = compatibili.filter(r => valoriAltro.includes(r[colAltro]));
          }
        });

        const valoriDisponibili = new Set(compatibili.map(r => r[col]).filter(v => v !== undefined && v !== null && String(v) !== ""));
        selezionati.forEach(v => valoriDisponibili.add(v));
        
        checkboxes.forEach(chk => {
          const val = chk.value;
          const lbl = chk.parentElement;
          if (valoriDisponibili.has(val)) {
            lbl.style.display = "flex";
          } else {
            lbl.style.display = "none";
          }
        });
      });
    }

    function applicaFiltro() {
      const filtriNodo = document.getElementById("filtri-attivi");
      filtriNodo.innerHTML = "";
      let arr = [...dati];
      let descrizioniFiltri = [];

      const testoRicerca = document.getElementById("input-ricerca-diretta")?.value.trim().toLowerCase() || "";
      if (testoRicerca !== "") {
        arr = arr.filter(r => {
          const van = String(r[chiaveCampo(r, "VAN")] || "").toLowerCase();
          const telaio = String(r[chiaveCampo(r, "telaio")] || "").toLowerCase();
          const descrizione = String(r[chiaveCampo(r, "descrizione")] || "").toLowerCase();
          const idVeicolo = String(r[chiaveCampo(r, "id_veicolo")] || "").toLowerCase();

          return van.includes(testoRicerca) || 
                 telaio.includes(testoRicerca) || 
                 descrizione.includes(testoRicerca) || 
                 idVeicolo.includes(testoRicerca);
        });
        descrizioniFiltri.push(`Ricerca diretta: "${testoRicerca}"`);

        const badgeRicerca = document.createElement("span");
        badgeRicerca.className = "badge";
        badgeRicerca.textContent = `🔍 "${testoRicerca}"`;
        const btnResetRicerca = document.createElement("button");
        btnResetRicerca.textContent = "×";
        btnResetRicerca.title = "Cancella ricerca";
        btnResetRicerca.onclick = () => {
          document.getElementById("input-ricerca-diretta").value = "";
          applicaFiltro();
        };
        badgeRicerca.append(btnResetRicerca);
        filtriNodo.append(badgeRicerca);
      }

      document.querySelectorAll(".filtro-box").forEach(box => {
        const idx = parseInt(box.getAttribute("data-col-index"), 10);
        const col = intestazione[idx];
        const selvals = Array.from(box.querySelectorAll("input[type='checkbox']:checked")).map(c => c.value);
        
        if (selvals.length > 0) {
          arr = arr.filter(r => selvals.includes(r[col]));
          descrizioniFiltri.push(`${col}: [${selvals.join(", ")}]`);

          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = `${col}: ${selvals.join(", ")}`;
          const btn = document.createElement("button");
          btn.textContent = "×";
          btn.title = "Rimuovi questo filtro";
          btn.onclick = () => {
            box.querySelectorAll("input[type='checkbox']").forEach(chk => {
              if (selvals.includes(chk.value)) chk.checked = false;
            });
            applicaFiltro();
          };
          badge.append(btn);
          filtriNodo.append(badge);
        }
      });

      if (descrizioniFiltri.length > 0) {
        inviaLogAttivita("Filtro applicato: " + descrizioniFiltri.join(" | "));
      } else {
        inviaLogAttivita("Filtro applicato: (Nessun filtro selezionato - Mostra tutti)");
      }

      aggiornaOpzioniFiltri();
      mostraTabella(arr);
      mostraMessaggio(`${arr.length} record trovati`);
    }

    function apriRiepilogo() {
      inviaLogAttivita("Apertura Riepilogo Selezione (Record analizzati: " + datiCorrenti.length + ")");

      const modal = document.getElementById("riepilogoModal");
      const cont = document.getElementById("contenutoRiepilogo");

      const mappaRiepilogo = {};

      datiCorrenti.forEach(r => {
        const tipoVeicolo = r[chiaveCampo(r, "tipo_veicolo")]?.trim() || "—";
        const descrizione = r[chiaveCampo(r, "descrizione")]?.trim() || "N/D";
        const status = r[chiaveCampo(r, "descri_status")]?.trim() || "N/D";
        const tipoAllestimento = r[chiaveCampo(r, "tipo_allestimento")]?.trim() || "";
        const prenotatoDa = r[chiaveCampo(r, "prenotato_da")]?.trim() || "";

        const chiaveGroup = `${tipoVeicolo}___${descrizione}`;

        if (!mappaRiepilogo[chiaveGroup]) {
          mappaRiepilogo[chiaveGroup] = {
            tipo_veicolo: tipoVeicolo,
            descrizione: descrizione,
            totale: 0,
            status_map: {},
            prenotati: 0,
            allestiti: 0
          };
        }

        const gruppo = mappaRiepilogo[chiaveGroup];
        gruppo.totale += 1;
        gruppo.status_map[status] = (gruppo.status_map[status] || 0) + 1;
        if (prenotatoDa !== "") gruppo.prenotati += 1;
        if (tipoAllestimento !== "" && tipoAllestimento !== "—") gruppo.allestiti += 1;
      });

      const listaOrdinata = Object.values(mappaRiepilogo).sort((a, b) => {
        const compTipo = a.tipo_veicolo.localeCompare(b.tipo_veicolo, "it");
        if (compTipo !== 0) return compTipo;
        return a.descrizione.localeCompare(b.descrizione, "it");
      });

      let html = `
        <div class="table-responsive-wrapper">
          <table class="tabella-riepilogo">
            <thead>
              <tr>
                <th>Tipo Veicolo</th>
                <th>Descrizione</th>
                <th>Totale</th>
                <th>di cui Status</th>
                <th>di cui Prenotati</th>
                <th>di cui Allestiti</th>
              </tr>
            </thead>
            <tbody>
      `;

      if (listaOrdinata.length === 0) {
        html += `<tr><td colspan="6" style="text-align:center;">Nessun dato disponibile.</td></tr>`;
      } else {
        listaOrdinata.forEach(item => {
          const stringaStatus = Object.entries(item.status_map)
            .map(([st, count]) => `• ${st}: <strong>${count}</strong>`)
            .join("<br>");

          html += `
            <tr>
              <td><strong>${item.tipo_veicolo}</strong></td>
              <td>${item.descrizione}</td>
              <td style="text-align:center;"><strong>${item.totale}</strong></td>
              <td>${stringaStatus}</td>
              <td style="text-align:center; font-weight:bold; color:${item.prenotati > 0 ? '#c62828' : 'inherit'};">${item.prenotati}</td>
              <td style="text-align:center; font-weight:bold; color:${item.allestiti > 0 ? '#16803c' : 'inherit'};">${item.allestiti}</td>
            </tr>
          `;
        });
      }

      html += `
            </tbody>
          </table>
        </div>
      `;
      cont.innerHTML = html;
      modal.style.display = "block";
    }

    function stampaModale() {
      const contenuto = document.getElementById('contenutoDettagli').innerHTML;
      const finestraStampa = window.open('', '', 'width=900,height=700');
      if (!finestraStampa) {
        alert('Consenti l’apertura della finestra di stampa per proseguire.');
        return;
      }

      finestraStampa.document.write(`
        <!DOCTYPE html>
        <html lang="it">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Scheda veicolo</title>
            <style>
              * { box-sizing: border-box; }
              body { font-family: Arial, Helvetica, sans-serif; color: #243447; background: #fff; margin: 0; padding: 18px; font-size: 14px; line-height: 1.45; }
              .modale-doppia-colonna { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
              .colonna-sinistra, .colonna-destra { min-width: 0; background: #fff; }
              h2 { margin: 0 0 14px; padding: 0 0 10px; color: #123e63; font-size: 22px; border-bottom: 3px solid #00a6d6; }
              h3 { margin: 4px 0 12px; padding: 9px 12px; color: #123e63; font-size: 17px; background: #eaf4fb; border-left: 4px solid #00a6d6; border-radius: 4px; }
              .lista-dettagli { list-style: none; padding: 0; margin: 0; }
              .lista-dettagli li { display: grid; grid-template-columns: minmax(115px, 42%) minmax(0, 1fr); gap: 10px; padding: 8px 10px; margin: 0; border-bottom: 1px solid #e4ebf0; overflow-wrap: anywhere; }
              .lista-dettagli li:nth-child(even) { background: #f5f9fc; }
              .lista-dettagli li strong { color: #34546d; text-align: left; }
              .lista-dettagli li span { color: #172b3a; text-align: left; }
              .tabella-optional { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
              .tabella-optional th, .tabella-optional td { border: 1px solid #d6e0e8; padding: 8px; text-align: left; overflow-wrap: anywhere; }
              .tabella-optional th { background: #123e63; color: #fff; }
              .tabella-optional tbody tr:nth-child(even) { background: #f5f9fc; }
              a { color: #075b96; }
            </style>
          </head>
          <body>${contenuto}</body>
        </html>
      `);
      finestraStampa.document.close();
      finestraStampa.focus();
      setTimeout(() => finestraStampa.print(), 300);
    }
  </script>

  <!-- Modale Dettagli Veicolo -->
  <div id="dettagliModal" class="modal-overlay">
    <div class="modal-content">
      <button onclick="document.getElementById('dettagliModal').style.display='none'" style="float:right;">Chiudi ×</button>
      <button onclick="stampaModale()">Stampa veicolo</button>
      <div id="contenutoDettagli"></div>
    </div>
  </div>

  <!-- Modale per il Riepilogo Selezione -->
  <div id="riepilogoModal" class="modal-overlay">
    <div class="modal-content">
      <button onclick="document.getElementById('riepilogoModal').style.display='none'" style="float:right; border:0; background:#ccc; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">Chiudi ×</button>
      <h2>Riepilogo Selezione</h2>
      <div id="contenutoRiepilogo"></div>
    </div>
  </div>

</body>
</html>
