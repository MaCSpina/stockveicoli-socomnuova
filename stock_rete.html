<script>
const cacheBuster = "?t=" + new Date().getTime();
const urlRete = "https://gist.githubusercontent.com/MaCSpina/8eef93f4d67ccbdb1aaaf6d94196095d/raw/veicoli_rete_con_versione_passo_furgone.csv" + cacheBuster;
const apiOptionalGist = "https://api.github.com/gists/3f99e0346bab2fe686f1ee8572be63f7";

function settimanaToRange(settimanaStr) {
  const match = /^(\d{4})-(\d{1,2})$/.exec(settimanaStr);
  if (!match) return settimanaStr;
  const year = parseInt(match[1], 10);
  const week = parseInt(match[2], 10);
  const simple = new Date(year, 0, 1 + (week - 1) * 7);
  const dow = simple.getDay();
  const monday = new Date(simple);
  if (dow <= 4) {
    monday.setDate(simple.getDate() - simple.getDay() + 1);
  } else {
    monday.setDate(simple.getDate() + 8 - simple.getDay());
  }
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const format = (d) => d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  return `${settimanaStr} <span class="range-date">(${format(monday)} - ${format(sunday)})</span>`;
}

function escapeRegex(text) {
  return text.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&');
}

function escapeJQuerySelector(str) {
  return str.replace(/([ #;&,.+*~\':"!^$[\]()=>|/@])/g, '\\$1');
}

$(document).ready(function () {
  $.ajax({
    url: urlRete,
    dataType: "text"
  }).done(function (resRete) {
    $.ajax({
      url: apiOptionalGist,
      dataType: "json"
    }).always(function (gistResponse) {
      let optionalMap = {};

      try {
        if (gistResponse && gistResponse.files) {
          const filenames = Object.keys(gistResponse.files);
          let targetFilename = filenames.find(f => f.toLowerCase().includes('optional'));
          if (!targetFilename && filenames.length > 0) {
            targetFilename = filenames[0];
          }

          if (targetFilename && gistResponse.files[targetFilename]) {
            const csvContent = gistResponse.files[targetFilename].content;
            const parsedOpt = Papa.parse(csvContent, { header: true, skipEmptyLines: true, delimiter: ";" });
            
            parsedOpt.data.forEach(row => {
              const cleanRow = {};
              for (let k in row) {
                cleanRow[k.trim().toLowerCase().replace(/["']/g, '')] = String(row[k] || "").trim();
              }

              const versioneVal = cleanRow["versione"] || "";
              const codOptRaw = cleanRow["optional"] || "";
              const descOpt = cleanRow["descrizione"] || "";
              let prezzoVal = parseFloat((cleanRow["prezzo"] || "0").replace(',', '.')) || 0;

              if (versioneVal && codOptRaw && descOpt) {
                const chiave10 = versioneVal.substring(0, 10).toUpperCase();
                const codNormalized = codOptRaw.replace(/^0+/, '');
                
                if (!optionalMap[chiave10]) {
                  optionalMap[chiave10] = {};
                }
                optionalMap[chiave10][codNormalized] = {
                  descrizione: descOpt,
                  prezzo: prezzoVal
                };
              }
            });
          }
        }
      } catch (e) {
        console.warn("Errore parsing optional:", e);
      }

      const parsedRete = Papa.parse(resRete, { header: true, skipEmptyLines: true, delimiter: ";" });
      let originalData = parsedRete.data;

      const colsDaEscludere = [
        "Discretional Discount Request", "Discretional Discount Approved",
        "Marketing Campaign", "Marketing Campaign Approved", "Unnamed: 16",
        "Nr Ordine", "Stato Refurbishing", "Cliente Finale", "Order Date",
        "Soglia di Fatturazione", "Data inserimento OCF", "Nr Preventivo",
        "Rif. Ordine Dealer", "Richiesta Sconto Discrezionale",
        "Sconto Discrezionale Approvato", "Richiesta Campagna Marketing",
        "Campagna Marketing Approvata"
      ];

      const allPossibleKeys = new Set();
      originalData.forEach(row => {
        if (row) { Object.keys(row).forEach(k => allPossibleKeys.add(k.trim())); }
      });
      const uniqueKeysList = Array.from(allPossibleKeys);

      let cleanedData = originalData.map(row => {
        const newRow = {};
        let biVal = "";
        let vpVal = "";

        for (let k in row) {
          const cleanK = k.trim();
          const lowerK = cleanK.toLowerCase().replace(/[\s\.]/g, '');
          let val = row[k];
          if (typeof val === 'string') val = val.trim();

          if (lowerK === "bi" || lowerK === "bloccointerscambio") {
            biVal = val;
          }
          if (cleanK.toUpperCase() === "VP" || lowerK === "vp") {
            vpVal = val;
          }

          newRow[cleanK] = val !== undefined && val !== null ? val : "";
        }
        
        newRow["B. I."] = (biVal !== undefined && biVal !== null && String(biVal).trim() !== "") ? String(biVal).trim() : "";

        if (vpVal && vpVal.length >= 5) {
          const vp10 = vpVal.substring(0, 10).toUpperCase();
          const optCatalogo = optionalMap[vp10];

          if (optCatalogo) {
            let descrizioniRisolte = [];
            let listaDettaglio = [];

            for (let k in newRow) {
              if (k.toLowerCase().includes('optional') || k.toLowerCase().includes('opzion')) {
                let cellaVal = String(newRow[k] || "").trim();
                if (cellaVal) {
                  let codiciSingoli = cellaVal.split(/\s+/);
                  let descrizioniSingole = [];

                  codiciSingoli.forEach(codReteRaw => {
                    let codReteNorm = codReteRaw.replace(/^0+/, '');
                    if (optCatalogo[codReteNorm]) {
                      let optInfo = optCatalogo[codReteNorm];
                      let testoItem = `[${codReteRaw}] ${optInfo.descrizione}`;
                      
                      if (optInfo.prezzo > 0) {
                        testoItem = `<strong>${testoItem}</strong>`;
                      }

                      descrizioniSingole.push(testoItem);
                      descrizioniRisolte.push(testoItem);
                      listaDettaglio.push({ colonna: k, codice: codReteRaw, descrizione: optInfo.descrizione, prezzo: optInfo.prezzo });
                    } else {
                      descrizioniSingole.push(codReteRaw);
                      listaDettaglio.push({ colonna: k, codice: codReteRaw, descrizione: codReteRaw, prezzo: 0 });
                    }
                  });

                  newRow[k] = descrizioniSingole.join(", ");
                }
              }
            }

            if (descrizioniRisolte.length > 0) {
              newRow["Optional_Descrizione"] = descrizioniRisolte.join(", ");
              newRow["Optional_Lista"] = listaDettaglio;
            }
          }
        }

        return newRow;
      }).filter(row => row["Modello"] || row["Nr Veicolo"]);

      cleanedData.forEach(row => {
        if (row["Data Consegna Stimata"]) {
          row["Data Consegna Stimata"] = settimanaToRange(row["Data Consegna Stimata"]);
        }
      });

      const finalCols = uniqueKeysList.filter(c => {
        return !colsDaEscludere.some(ex => ex.toLowerCase() === c.toLowerCase());
      });

      if (!finalCols.includes("B. I.")) { finalCols.push("B. I."); }

      const mappingFiltri = {
        "VAN": ["VAN", "Nr Veicolo", "Nr. Veicolo", "Veicolo"],
        "Modello": ["Modello"],
        "Stato Primario": ["Stato Primario", "Stato primario"],
        "Concessionario": ["Concessionario", "Dealer", "Concessionaria"],
        "Passo": ["Passo"],
        "Altezza Furgone": ["Altezza Furgone", "Altezza furgone", "Altezza"],
        "B. I.": ["B. I.", "B.I.", "BI"]
      };

      const resolvedCols = {};
      Object.keys(mappingFiltri).forEach(logicalKey => {
        const candidates = mappingFiltri[logicalKey];
        const found = finalCols.find(k => {
          const cleanK = k.toLowerCase().replace(/[\s\.]/g, '');
          return candidates.some(c => cleanK === c.toLowerCase().replace(/[\s\.]/g, ''));
        });
        resolvedCols[logicalKey] = found || logicalKey;
      });

      const colonneDaFiltrare = Object.values(resolvedCols);
      const filtriContainer = $('#filtri-container').empty();

      colonneDaFiltrare.forEach(col => {
        const logicalLabel = Object.keys(resolvedCols).find(k => resolvedCols[k] === col) || col;
        const filtroBox = $('<div class="filtro-box"></div>');
        filtroBox.append(`<label for="filtro_${escapeJQuerySelector(col)}">${logicalLabel}</label>`);

        const select = $('<select multiple></select>').attr('id', 'filtro_' + col);
        const uniqueVals = [...new Set(cleanedData.map(r => {
          const v = r[col];
          return (v === undefined || v === null || String(v).trim() === '') ? '(Vuoto)' : String(v).trim();
        }))].sort((a, b) => {
          if (a === '(Vuoto)') return 1;
          if (b === '(Vuoto)') return -1;
          return a.localeCompare(b);
        });
        
        uniqueVals.forEach(val => { select.append(`<option value="${val}">${val}</option>`); });
        filtroBox.append(select);
        filtriContainer.append(filtroBox);
      });

      const theadRow = $('#tabella thead tr');
      theadRow.empty();

      finalCols.forEach(col => {
        theadRow.append(`<th>${col}</th>`);
      });

      const table = $('#tabella').DataTable({
        data: cleanedData,
        columns: finalCols.map(col => {
          const isOptCol = col.toLowerCase().includes('optional') || col.toLowerCase().includes('opzion');
          return {
            data: col,
            title: col,
            defaultContent: "",
            className: isOptCol ? "col-optional" : "",
            render: function(data, type, row) {
              return data;
            }
          };
        }),
        pageLength: 25,
        language: {
          emptyTable: "Nessun dato disponibile",
          zeroRecords: "Nessun veicolo trovato",
          infoEmpty: "Mostrati da 0 a 0 di 0 elementi",
          infoFiltered: "(filtrati da _MAX_ elementi totali)",
          info: "Mostrati da _START_ a _END_ di _TOTAL_ elementi",
          lengthMenu: "Mostra _MENU_ elementi per pagina",
          paginate: { first: "Primo", last: "Ultimo", next: "Successivo", previous: "Precedente" }
        },
        dom: 'lrtip'
      });

      function apriModaleConDati(data) {
        let html = '<table style="width:100%; border-collapse: collapse;">';
        for (const key in data) {
          if (data.hasOwnProperty(key) && !colsDaEscludere.some(ex => ex.toLowerCase() === key.toLowerCase()) && key !== "Optional_Descrizione" && key !== "Optional_Lista") {
            const classeExtra = key.toLowerCase() === "concessionario" ? ' class="riga-concessionario"' : '';
            let valoreMostrato = data[key] || "—";

            if (key.toLowerCase().includes('optional') && data["Optional_Lista"]) {
              let optTrovato = data["Optional_Lista"].filter(o => o.colonna === key);
              if (optTrovato.length > 0) {
                let badgeHtml = '<ul class="opt-badge-list">';
                optTrovato.forEach(opt => {
                  let stileGrassetto = opt.prezzo > 0 ? 'font-weight: bold; color: #003366;' : '';
                  badgeHtml += `<li style="${stileGrassetto}"><strong>[${opt.codice}]</strong> ${opt.descrizione} ${opt.prezzo > 0 ? '(Extra: € ' + opt.prezzo + ')' : ''}</li>`;
                });
                badgeHtml += '</ul>';
                valoreMostrato = badgeHtml;
              }
            }

            html += `<tr${classeExtra}><td style="font-weight:bold; border: 1px solid #ddd; padding:8px; background:#f0f4f8; width:35%;">${key}</td><td style="border: 1px solid #ddd; padding:8px; word-break: break-word;">${valoreMostrato}</td></tr>`;
          }
        }
        html += '</table>';
        $('#titolo-modale').text("Dettaglio Veicolo");
        $('#toggle-concessionario').show();
        $('#contenuto-modale').html(html);
        $('#modal-dettaglio, #overlay').show();
      }

      function mostraDettaglioCombinato(contatori) {
        const righeOrdinate = Object.entries(contatori).sort((a, b) => {
          const [modA, passoA, altA] = a[0].split(' | ');
          const [modB, passoB, altB] = b[0].split(' | ');
          if (modA !== modB) return modA.localeCompare(modB);
          if (passoA !== passoB) return passoA.localeCompare(passoB);
          return altA.localeCompare(altB);
        });

        let html = '<table style="width:100%; border-collapse: collapse; font-size:14px;">';
        html += '<tr style="background:#003366; color:white;"><th style="border: 1px solid #ddd; padding:8px;">Modello</th><th style="border: 1px solid #ddd; padding:8px;">Passo</th><th style="border: 1px solid #ddd; padding:8px;">Altezza Furgone</th><th style="border: 1px solid #ddd; padding:8px; text-align:right;">Quantità</th></tr>';

        let modelloCorrente = null;
        righeOrdinate.forEach(([key, count]) => {
          const [modello, passo, altezza] = key.split(' | ');
          const altezzaVisibile = (!altezza || altezza.trim() === "" || altezza.trim().toLowerCase() === "sconosciuto") ? "—" : altezza;

          if (modello !== modelloCorrente) {
            modelloCorrente = modello;
            html += `<tr style="background:#eaf3fb;"><td colspan="4" style="font-weight:bold; border: 1px solid #ddd; padding:6px; color:#0055aa;">Modello: ${modello}</td></tr>`;
          }

          html += `<tr>
            <td style="border: 1px solid #ddd; padding:6px;"></td>
            <td style="border: 1px solid #ddd; padding:6px;">${passo}</td>
            <td style="border: 1px solid #ddd; padding:6px;">${altezzaVisibile}</td>
            <td style="border: 1px solid #ddd; padding:6px; text-align:right; font-weight:bold;">${count}</td>
          </tr>`;
        });

        html += '</table>';
        
        $('#titolo-modale').text("Riepilogo per Modello, Passo e Altezza Furgone");
        $('#toggle-concessionario').hide();
        $('#contenuto-modale').html(html);
        $('#modal-dettaglio, #overlay').show();
      }

      $('#chiudi-modale, #overlay').on('click', function() {
        $('#modal-dettaglio, #overlay').hide();
      });

      $('#tabella tbody').on('click', 'tr', function () {
        const datiRiga = table.row(this).data();
        apriModaleConDati(datiRiga);
      });

      $('#toggle-concessionario').on('click', function () {
        const celle = $('#contenuto-modale td').filter(function () {
          return $(this).text().trim().toLowerCase() === 'concessionario';
        });
        celle.each(function () {
          const $riga = $(this).closest('tr');
          $riga.toggle();
        });
        const isHidden = $('#contenuto-modale td').filter(function () {
          return $(this).text().trim().toLowerCase() === 'concessionario';
        }).closest('tr').is(':hidden');
        $(this).text(isHidden ? 'Mostra Concessionario' : 'Nascondi Concessionario');
      });

      function aggiornaMessaggio() {
        const info = table.page.info();
        let msg = "";
        if (info.recordsDisplay !== info.recordsTotal) {
          msg = `🔍 Filtrati <strong>${info.recordsDisplay}</strong> veicoli su un totale di ${info.recordsTotal}.<br>`;
        } else {
          msg = `📋 Mostrati <strong>${info.start + 1} - ${info.end}</strong> de <strong>${info.recordsTotal}</strong> veicoli totali.<br>`.replace('de', 'di');
        }

        const datiFiltrati = table.rows({filter: 'applied'}).data().toArray();
        const contatoriCombinati = {};

        const colMod = resolvedCols["Modello"] || "Modello";
        const colPasso = resolvedCols["Passo"] || "Passo";
        const colAltezza = resolvedCols["Altezza Furgone"] || "Altezza Furgone";

        datiFiltrati.forEach(item => {
          const modello = item[colMod] || "Sconosciuto";
          const passo = item[colPasso] || "Sconosciuto";
          const altezza = item[colAltezza] || "—";
          const key = `${modello} | ${passo} | ${altezza}`;
          contatoriCombinati[key] = (contatoriCombinati[key] || 0) + 1;
        });

        const totaleCombinazioni = Object.keys(contatoriCombinati).length;
        msg += `Combinazioni uniche (Modello / Passo / Altezza): <strong>${totaleCombinazioni}</strong> <button id="btn-dettaglio-modelli" style="margin-left:10px;">Visualizza Dettaglio Riepilogo</button>`;

        $('#messaggio-filtri').html(msg);

        $('#btn-dettaglio-modelli').off('click').on('click', function(e) {
          e.stopPropagation();
          mostraDettaglioCombinato(contatoriCombinati);
        });
      }

      function aggiornaFiltri() {
        colonneDaFiltrare.forEach(col => {
          const index = finalCols.indexOf(col);
          if (index !== -1) {
            const filtro = $('#' + escapeJQuerySelector('filtro_' + col));
            if (filtro.length) {
              let vals = filtro.multipleSelect('getSelects');
              if (vals && vals.length > 0) {
                if (col === resolvedCols["B. I."]) {
                  const wantsVuoto = vals.includes('(Vuoto)');
                  const wantsX = vals.includes('X');

                  if (wantsVuoto && !wantsX) {
                    table.column(index).search('^$', true, false);
                  } else if (wantsX && !wantsVuoto) {
                    table.column(index).search('^X$', true, false);
                  } else {
                    table.column(index).search('', true, false);
                  }
                } else {
                  const regexParts = vals.map(v => v === '(Vuoto)' ? '^$' : '^' + escapeRegex(v) + '$');
                  table.column(index).search(regexParts.join('|'), true, false);
                }
              } else {
                table.column(index).search('');
              }
            }
          }
        });
        table.draw();
        aggiornaMessaggio();
      }

      function resettaFiltri() {
        colonneDaFiltrare.forEach(col => {
          const filtro = $('#' + escapeJQuerySelector('filtro_' + col));
          if (filtro.length) {
            filtro.multipleSelect('uncheckAll');
            filtro.multipleSelect('close');
          }
        });
        table.columns().search('').draw();
        aggiornaMessaggio();
      }

      colonneDaFiltrare.forEach(col => {
        const filtro = $('#' + escapeJQuerySelector('filtro_' + col));
        if (filtro.length) {
          filtro.multipleSelect({
            placeholder: `Filtra ${col}`,
            filter: true,
            selectAll: false
          });
          filtro.multipleSelect('refresh');
        }
      });

      $('#btn-applica').on('click', aggiornaFiltri);
      $('#btn-reset').on('click', resettaFiltri);

      aggiornaMessaggio();
    });
  }).fail(function() {
    $('#messaggio-filtri').html("❌ Errore critico nel caricamento del file Gist principale.");
  });
});
</script>

</body>
</html>
