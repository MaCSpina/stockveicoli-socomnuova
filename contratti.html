<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121e2d" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <title>Socom - Contratti in Arrivo</title>
  <style>
    /* Stili generali */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #121e2d; color: white; }
    header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    h1 { margin: 0; font-size: 1.8em; color: #00bfff; }
    #ultimo-aggiornamento { font-size: 0.9em; color: #cccccc; margin-top: 4px; }
    
    .user-badge-container { display: flex; align-items: center; gap: 10px; background: #1c2d42; padding: 8px 14px; border-radius: 8px; border: 1px solid #0055aa; }
    .user-badge-text { font-size: 0.9em; color: #00e5ff; font-weight: bold; }
    .btn-nav { background: #0055aa; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 0.9em; }
    .btn-nav:hover { background: #004080; }
    .btn-logout { background: #d32f2f; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8em; font-weight: bold; }

    /* Filtri a Checkbox */
    .filtri { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
    .filtro { display: flex; flex-direction: column; min-width: 180px; flex: 1; max-width: 300px; }
    .filtro-box {
      background: #f8f8f8;
      border: 1px solid #ccc;
      border-radius: 6px;
      max-height: 120px;
      overflow-y: auto;
      padding: 8px 10px;
      color: #333;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .filtro-box label { font-weight: normal; font-size: 0.9em; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #333; }
    .filtro-box input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; }
    
    /* Input di Ricerca */
    .search-container { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .search-input {
      padding: 10px 14px;
      font-size: 15px;
      border: 2px solid #0055aa;
      border-radius: 6px;
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      color: #333;
      box-sizing: border-box;
    }
    .search-input:focus { outline: none; border-color: #00bfff; box-shadow: 0 0 8px rgba(0, 191, 255, 0.4); }

    /* Tabella */
    #tabella-container table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.88em; background: white; color: black; table-layout: auto; }
    #tabella-container th, #tabella-container td { border: 1px solid #ccc; padding: 7px; text-align: left; }
    #tabella-container th { background: #003366; color: white; position: sticky; top: 0; z-index: 2; white-space: nowrap; }
    #tabella-container td { white-space: normal; }
    
    /* Evidenziazione Ritardi e Badge Anomalia */
    .ritardo-alto { background-color: #ffebee !important; color: #c62828; font-weight: bold; }
    .badge-anomalia { display: inline-block; margin-left: 6px; padding: 2px 6px; background: #d32f2f; color: #ffffff; font-size: 11px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
    
    .status-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
    #msg { font-weight: bold; color: #fff; }
    #filtri-attivi { margin-bottom: 15px; font-style: italic; color: #ffcccc; font-weight: bold; }
    .badge { background: #d32f2f; padding: 4px 8px; border-radius: 12px; margin-right: 8px; display: inline-flex; align-items: center; color: #fff; font-weight: bold; }
    .badge button { border: none; background: none; margin-left: 6px; cursor: pointer; font-weight: bold; color: #fff; font-size: 14px; }
    .toolbar { margin-bottom: 15px; display: flex; gap: 10px; }

    /* Stili Modale PDF / iOS Anti-White Screen */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; justify-content: center; align-items: center; }
    .modal-content { background: #fff; width: 92%; max-width: 900px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }

    @media (max-width: 768px) {
      header { flex-direction: column; align-items: flex-start; }
      .user-badge-container { width: 100%; justify-content: space-between; box-sizing: border-box; }
      .filtri { flex-direction: column; }
      .filtro { max-width: 100%; width: 100%; }
      .filtro-box { max-height: 100px; }
      .search-input { max-width: 100%; }
      
      #tabella-container table, #tabella-container thead, #tabella-container tbody, #tabella-container th, #tabella-container td, #tabella-container tr { display: block; }
      #tabella-container thead { display: none; }
      #tabella-container tbody tr { margin: 0 0 16px 0; padding: 8px 10px 4px; border: 2px solid #6f8da9; border-left: 6px solid #00a6d6; border-radius: 10px; background: #f7fbff; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22); }
      #tabella-container tbody td { position: relative; padding: 10px 6px 10px 48%; border: none; border-bottom: 1px solid #c8d7e5; line-height: 1.35; overflow-wrap: anywhere; text-align: left; }
      #tabella-container tbody td:last-child { border-bottom: none; }
      #tabella-container tbody td::before { content: attr(data-label); position: absolute; left: 6px; top: 10px; width: 43%; color: #17476e; font-size: 0.92em; line-height: 1.25; white-space: normal; font-weight: bold; }
    }
  </style>
</head>
<body>

<script>
    if (sessionStorage.getItem("isAuthorized") !== "true") {
        window.location.href = "index.html";
    }
</script>

  <header>
    <div>
      <h1>📋 Contratti Veicoli in Arrivo</h1>
      <div id="ultimo-aggiornamento">Caricamento data ultimo aggiornamento...</div>
    </div>
    
    <div class="user-badge-container">
      <a href="app.html" class="btn-nav" onclick="logNavigazioneStock(event)">🚚 Torna allo Stock</a>
      <div class="user-badge-text">👤 <span id="nomeUtenteLogged">Ospite</span></div>
      <button class="btn-logout" onclick="logout()">Esci</button>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <button class="btn-nav" onclick="resettaFiltro()">Reset Filtri</button>
      <button class="btn-nav" onclick="caricaDatiContratti()">Aggiorna Dati</button>
    </div>

    <!-- Campo Ricerca Diretta -->
    <div class="search-container">
      <input 
        type="text" 
        id="input-ricerca-diretta" 
        class="search-input" 
        placeholder="🔍 Cerca Agente, Cliente, VAN, Telaio, Contratto..." 
        oninput="applicaFiltro()"
      >
    </div>

    <div class="status-bar">
      <div id="msg"></div>
    </div>

    <div id="filtri-attivi"></div>
    <div class="filtri" id="parametri"></div>
    <div id="tabella-container"></div>
  </main>

  <script>
    const GIST_ID = "3f99e0346bab2fe686f1ee8572be63f7";
    const URL_GIST_CONTRATTI = "https://gist.githubusercontent.com/MaCSpina/3f99e0346bab2fe686f1ee8572be63f7/raw/cdc95265dd99ab993a749aa07ebc371b30dafaf7/veicoli_contratti_in_arrivo.txt";
    let URL_LOG_SCRIPT = "";
    let ipUtentePubblico = "In rilevamento...";

    const TIMEOUT_INATTIVITA_MS = 60 * 60 * 1000;
    let timerInattivita;

    function resetTimerInattivita() {
      clearTimeout(timerInattivita);
      timerInattivita = setTimeout(logoutPerInattivita, TIMEOUT_INATTIVITA_MS);
    }

    async function logoutPerInattivita() {
      const utente = sessionStorage.getItem("currentUser") || "Utente";
      const logUrl = URL_LOG_SCRIPT || sessionStorage.getItem("URL_LOG_SCRIPT");
      if (logUrl) {
        try {
          await fetch(logUrl, {
            method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ utente: utente, note: "Disconnessione automatica per inattività (Contratti) | IP: " + ipUtentePubblico, dispositivo: navigator.userAgent })
          });
        } catch(e) {}
      }
      sessionStorage.clear();
      alert("Sessione scaduta per inattività (1 ora).");
      window.location.href = "index.html";
    }

    ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
      window.addEventListener(evt, resetTimerInattivita, true);
    });

    fetch("https://api.ipify.org?format=json")
      .then(res => res.json()).then(data => { ipUtentePubblico = data.ip; }).catch(() => {});

    async function inviaLogAttivita(testoNota) {
      const utente = sessionStorage.getItem("currentUser") || "Utente";
      const logUrl = URL_LOG_SCRIPT || sessionStorage.getItem("URL_LOG_SCRIPT");
      if (logUrl) {
        try {
          fetch(logUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
              utente: utente, 
              note: testoNota + " | IP: " + ipUtentePubblico,
              dispositivo: navigator.userAgent 
            })
          });
        } catch(e) {}
      }
    }

    function logNavigazioneStock(e) {
      if (e) e.preventDefault();
      window.onbeforeunload = null;

      const utente = sessionStorage.getItem("currentUser") || "Utente";
      const logUrl = URL_LOG_SCRIPT || sessionStorage.getItem("URL_LOG_SCRIPT");

      if (logUrl) {
        fetch(logUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            utente: utente,
            note: "Navigazione verso Stock veicoli | IP: " + ipUtentePubblico,
            dispositivo: navigator.userAgent
          })
        }).finally(() => {
          window.location.href = "app.html";
        });
      } else {
        window.location.href = "app.html";
      }
    }

    const colonneVisibili = [
      { label: "Agente", campo: "agente" },
      { label: "Anno", campo: "anno" },
      { label: "Tipo Contr.", campo: "tipo_contratto" },
      { label: "N° Contratto", campo: "numero_contratto" },
      { label: "Data Contr.", campo: "data_contr" },
      { label: "Prev. Consegna Contr.", campo: "prevista_consegna_contratto" },
      { label: "Prev. Consegna", campo: "prevista_consegna" },
      { label: "GG DIFF", campo: "GG_DIFF" },
      { label: "Tipo Veicolo", campo: "tipo_veicolo" },
      { label: "Descrizione", campo: "descrizione" },
      { label: "VAN", campo: "VAN_" },
      { label: "Telaio", campo: "telaio" },
      { label: "Ragione Sociale", campo: "ragione_sociale" },
      { label: "Stato Primario", campo: "Stato Primario" },
      { label: "Destinatario Merci", campo: "Destinatario Merci_Descrizione" }
    ];

    const campiFiltro = ["agente", "anno", "tipo_contratto", "GG_DIFF", "tipo_veicolo", "Stato Primario"];
    const campiDate = ["data_contr", "prevista_consegna_contratto", "prevista_consegna"];

    let intestazione = [], dati = [];

    function pulisciTesto(str) { return str ? String(str).replace(/^"+|"+$/g, '').trim() : ""; }

    function parseDataOggetto(str) {
      if (!str) return null;
      str = String(str).trim();
      if (str.includes("/")) {
        const parti = str.split(" ")[0].split("/");
        if (parti.length === 3) {
          return new Date(parseInt(parti[2], 10), parseInt(parti[1], 10) - 1, parseInt(parti[0], 10));
        }
      }
      const d = new Date(str);
      return isNaN(d) ? null : d;
    }

    function formattaData(str) {
      if (!str) return "—";
      str = String(str).trim();
      if (str.includes("/")) {
        const parti = str.split(" ")[0].split("/");
        if (parti.length === 3) return `${parti[0].padStart(2, '0')}/${parti[1].padStart(2, '0')}/${parti[2]}`;
      }
      const d = new Date(str);
      if (isNaN(d)) return str;
      return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    }

    function aggiornaDataUltimoModificaGist() {
      fetch(`https://api.github.com/gists/${GIST_ID}`)
        .then(res => res.json())
        .then(data => {
          if (data && data.updated_at) {
            const dataUltimaModifica = new Date(data.updated_at);
            const dataFormattata = dataUltimaModifica.toLocaleDateString("it-IT");
            const oraFormattata = dataUltimaModifica.toLocaleTimeString("it-IT");
            document.getElementById("ultimo-aggiornamento").textContent = 
              `Ultimo aggiornamento dati Gist: ${dataFormattata} ore ${oraFormattata}`;
          }
        })
        .catch(() => {
          document.getElementById("ultimo-aggiornamento").textContent = 
            "Ultimo caricamento: " + new Date().toLocaleTimeString("it-IT");
        });
    }

    function caricaDatiContratti() {
      fetch(URL_GIST_CONTRATTI + "?nocache=" + Date.now())
        .then(r => r.text())
        .then(testo => {
          const parsed = Papa.parse(testo.trim(), { delimiter: ";", header: true, skipEmptyLines: true });
          intestazione = parsed.meta.fields ? parsed.meta.fields.map(pulisciTesto) : [];
          dati = parsed.data.map(row => {
            const newObj = {};
            Object.keys(row).forEach(k => {
              const valPulito = pulisciTesto(row[k]);
              const keyPulita = pulisciTesto(k);
              
              if (keyPulita === "GG_DIFF") {
                const numVal = parseFloat(valPulito.replace(',', '.'));
                newObj[keyPulita] = !isNaN(numVal) ? String(Math.round(numVal)) : valPulito;
              } else {
                newObj[keyPulita] = valPulito;
              }
            });
            return newObj;
          });

          aggiornaDataUltimoModificaGist();
          creaFiltri();
          mostraTabella(dati);
          mostraMessaggio(`${dati.length} contratti trovati`);
        });
    }

    function creaFiltri() {
      const div = document.getElementById("parametri");
      div.innerHTML = "";
      
      campiFiltro.forEach(col => {
        let valoriUnici = [...new Set(dati.map(r => r[col]).filter(Boolean))];

        if (col === "GG_DIFF") {
          valoriUnici.sort((a, b) => parseInt(a, 10) - parseInt(b, 10));
        } else {
          valoriUnici.sort();
        }

        const box = document.createElement("div");
        box.className = "filtro-box";
        box.setAttribute("data-col-name", col);

        valoriUnici.forEach(v => {
          const lbl = document.createElement("label");
          const chk = document.createElement("input");
          chk.type = "checkbox";
          chk.value = v;
          chk.onchange = () => applicaFiltro();
          lbl.appendChild(chk);
          lbl.appendChild(document.createTextNode(v));
          box.appendChild(lbl);
        });

        const l = document.createElement("label");
        l.className = "filtro";
        l.innerHTML = `<strong>${col}</strong>`;
        l.appendChild(box);
        div.appendChild(l);
      });
    }

    function mostraTabella(arr) {
      const cont = document.getElementById("tabella-container");
      const t = document.createElement("table");
      const thead = document.createElement("thead");
      const trh = document.createElement("tr");

      colonneVisibili.forEach(col => {
        const th = document.createElement("th");
        th.textContent = col.label;
        trh.appendChild(th);
      });
      thead.appendChild(trh);
      t.appendChild(thead);

      const tbody = document.createElement("tbody");
      const oggi = new Date();
      oggi.setHours(0,0,0,0);

      arr.forEach(r => {
        const tr = document.createElement("tr");
        
        const dataPrevistaObj = parseDataOggetto(r["prevista_consegna"]);
        const dataPrevistaContrattoObj = parseDataOggetto(r["prevista_consegna_contratto"]);

        if (dataPrevistaObj && dataPrevistaContrattoObj && dataPrevistaObj > dataPrevistaContrattoObj) {
          tr.classList.add("ritardo-alto");
        }

        const eAnomalaOgniGiorno = (dataPrevistaObj && dataPrevistaObj < oggi);

        colonneVisibili.forEach(col => {
          const td = document.createElement("td");
          td.setAttribute("data-label", col.label);
          let v = r[col.campo] || "—";

          if (campiDate.includes(col.campo)) {
            v = formattaData(v);
          }

          td.textContent = v;

          if (col.campo === "prevista_consegna" && eAnomalaOgniGiorno) {
            const badgeAnomalia = document.createElement("span");
            badgeAnomalia.className = "badge-anomalia";
            badgeAnomalia.textContent = "⚠️ data prevista consegna anomala";
            td.appendChild(badgeAnomalia);
          }

          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      t.appendChild(tbody);
      cont.innerHTML = "";
      cont.appendChild(t);
    }

    function mostraMessaggio(txt) { document.getElementById("msg").textContent = txt; }

    // Funzione per autoridurre / aggiornare dinamicamente le opzioni dei filtri
    function aggiornaOpzioniFiltri() {
      const boxes = Array.from(document.querySelectorAll(".filtro-box"));
      boxes.forEach(box => {
        const col = box.getAttribute("data-col-name");
        const checkboxes = Array.from(box.querySelectorAll("input[type='checkbox']"));
        const selezionati = checkboxes.filter(chk => chk.checked).map(chk => chk.value);
        
        let compatibili = [...dati];
        boxes.forEach(altroBox => {
          if (altroBox === box) return;
          const colAltro = altroBox.getAttribute("data-col-name");
          const valoriAltro = Array.from(altroBox.querySelectorAll("input[type='checkbox']"))
                                   .filter(c => c.checked)
                                   .map(c => c.value);
          if (valoriAltro.length) {
            compatibili = compatibili.filter(r => valoriAltro.includes(r[colAltro]));
          }
        });

        const valoriDisponibili = new Set(compatibili.map(r => r[col]).filter(v => v !== undefined && v !== null && String(v) !== ""));
        selezionati.forEach(v => valoriDisponibili.add(v));
        
        checkboxes.forEach(chk => {
          const val = chk.value;
          const lbl = chk.parentElement;
          if (valoriDisponibili.has(val)) {
            lbl.style.display = "flex";
          } else {
            lbl.style.display = "none";
          }
        });
      });
    }

    function applicaFiltro() {
      const filtriNodo = document.getElementById("filtri-attivi");
      filtriNodo.innerHTML = "";
      let arr = [...dati];
      let descrizioniFiltri = [];

      const testoRicerca = document.getElementById("input-ricerca-diretta")?.value.trim().toLowerCase() || "";
      if (testoRicerca !== "") {
        arr = arr.filter(r => {
          return Object.values(r).some(val => String(val).toLowerCase().includes(testoRicerca));
        });
        descrizioniFiltri.push(`Ricerca contratti: "${testoRicerca}"`);

        const badgeRicerca = document.createElement("span");
        badgeRicerca.className = "badge";
        badgeRicerca.textContent = `🔍 "${testoRicerca}"`;
        const btnReset = document.createElement("button");
        btnReset.textContent = "×";
        btnReset.onclick = () => { document.getElementById("input-ricerca-diretta").value = ""; applicaFiltro(); };
        badgeRicerca.append(btnReset);
        filtriNodo.append(badgeRicerca);
      }

      document.querySelectorAll(".filtro-box").forEach(box => {
        const col = box.getAttribute("data-col-name");
        const selvals = Array.from(box.querySelectorAll("input[type='checkbox']:checked")).map(c => c.value);
        if (selvals.length > 0) {
          arr = arr.filter(r => selvals.includes(r[col]));
          descrizioniFiltri.push(`${col}: [${selvals.join(", ")}]`);

          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = `${col}: ${selvals.join(", ")}`;
          const btn = document.createElement("button");
          btn.textContent = "×";
          btn.onclick = () => {
            box.querySelectorAll("input[type='checkbox']").forEach(chk => { if (selvals.includes(chk.value)) chk.checked = false; });
            applicaFiltro();
          };
          badge.append(btn);
          filtriNodo.append(badge);
        }
      });

      if (descrizioniFiltri.length > 0) {
        inviaLogAttivita("Filtro Contratti applicato: " + descrizioniFiltri.join(" | "));
      } else {
        inviaLogAttivita("Filtro Contratti applicato: (Nessun filtro selezionato - Mostra tutti)");
      }

      aggiornaOpzioniFiltri();
      mostraTabella(arr);
      mostraMessaggio(`${arr.length} contratti trovati`);
    }

    function resettaFiltro() {
      document.getElementById("input-ricerca-diretta").value = "";
      document.querySelectorAll(".filtro-box input[type='checkbox']").forEach(chk => {
        chk.checked = false;
        chk.parentElement.style.display = "flex";
      });
      document.getElementById("filtri-attivi").innerHTML = "";
      
      inviaLogAttivita("Reset filtri Contratti effettuato");

      aggiornaOpzioniFiltri();
      mostraTabella(dati);
      mostraMessaggio(`${dati.length} contratti trovati`);
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = "index.html";
    }

    window.onload = () => {
      document.getElementById("nomeUtenteLogged").textContent = sessionStorage.getItem("currentUser") || "Utente";
      URL_LOG_SCRIPT = sessionStorage.getItem("URL_LOG_SCRIPT") || "";
      caricaDatiContratti();
      resetTimerInattivita();
    };
  </script>
</body>
</html>
